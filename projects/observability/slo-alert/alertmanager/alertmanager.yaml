# EN: Prometheus decides WHEN an alert fires. Alertmanager decides WHO hears about it and how
#     often: it groups alerts that belong together into one notification, waits a little for
#     more of them, repeats while they last, and tells the receiver when they are resolved.
#     The times below are short for the lab (production: group_wait 30s, group_interval 5m,
#     repeat_interval hours).
# PT: O Prometheus decide QUANDO um alerta dispara. O Alertmanager decide QUEM fica sabendo e
#     com que frequência: agrupa em uma notificação os alertas que andam juntos, espera um
#     pouco por mais alertas, repete enquanto eles duram e avisa o receiver quando se resolvem.
#     Os tempos abaixo são curtos para o laboratório (produção: group_wait 30s, group_interval
#     5m, repeat_interval de horas).
# ES: Prometheus decide CUÁNDO se dispara una alerta. Alertmanager decide QUIÉN se entera y con
#     qué frecuencia: agrupa en una notificación las alertas que van juntas, espera un
#     poco por más alertas, repite mientras duran y avisa al receiver cuando se resuelven.
#     Los tiempos de abajo son cortos para el laboratorio (producción: group_wait 30s, group_interval
#     5m, repeat_interval de horas).
route:
  receiver: on-call
  # EN: One notification per service and objective, not one per series.
  # PT: Uma notificação por serviço e objetivo, e não uma por série.
  # ES: Una notificación por servicio y objetivo, y no una por serie.
  group_by: [job, slo]
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 1h

receivers:
  - name: on-call
    webhook_configs:
      # EN: A local webhook stands for the pager. Nothing leaves the compose network.
      # PT: Um webhook local faz o papel do pager. Nada sai da rede do compose.
      # ES: Un webhook local hace el papel del pager. Nada sale de la red del compose.
      - url: http://receiver:8080/alerts
        send_resolved: true

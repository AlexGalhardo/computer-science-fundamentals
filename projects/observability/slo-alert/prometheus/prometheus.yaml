# EN: Prometheus pulls. Every 2 seconds it reads http://shop:8080/metrics, stores the samples,
#     evaluates the rules and sends firing alerts to Alertmanager. Production uses 15 to 60
#     seconds; the short interval only makes the lab react quickly.
# PT: O Prometheus puxa. A cada 2 segundos ele lê http://shop:8080/metrics, guarda as amostras,
#     avalia as regras e manda os alertas disparados ao Alertmanager. Em produção usa-se de 15 a
#     60 segundos; o intervalo curto só faz o laboratório reagir depressa.
global:
  scrape_interval: 2s
  evaluation_interval: 2s

rule_files:
  - /etc/prometheus/rules.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # EN: The job name becomes the `job` label of every series, the one the rules aggregate by.
  # PT: O nome do job vira o label `job` de toda série, aquele pelo qual as regras agregam.
  - job_name: shop
    static_configs:
      - targets: ["shop:8080"]

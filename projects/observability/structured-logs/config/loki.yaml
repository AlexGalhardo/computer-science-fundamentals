# EN: Loki in a single process, on the local file system. Loki indexes only the labels of a log
#     stream (here `service` and `format`), never the text of the lines, which is what keeps it
#     cheap. Everything else, such as the correlation id, is found by filtering the lines of
#     the selected streams at query time.
# PT: O Loki em um único processo, no sistema de arquivos local. O Loki indexa só os labels de
#     um stream de logs (aqui `service` e `format`), nunca o texto das linhas, e é isso que o
#     mantém barato. Todo o resto, como o correlation id, é encontrado filtrando as linhas dos
#     streams escolhidos na hora da consulta.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 24h

# EN: No usage statistics leave the machine.
# PT: Nenhuma estatística de uso sai da máquina.
analytics:
  reporting_enabled: false

# EN: Tempo in a single process, storing traces on its local disk. A trace is found either by
#     its id or by a TraceQL search over span and resource attributes.
# PT: O Tempo em um único processo, guardando os traces no disco local. Um trace é encontrado
#     pelo seu id ou por uma busca TraceQL sobre atributos de span e de resource.
# ES: Tempo en un solo proceso, guardando los traces en el disco local. Un trace se encuentra
#     por su id o por una búsqueda TraceQL sobre atributos de span y de resource.
server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# EN: No usage statistics leave the machine.
# PT: Nenhuma estatística de uso sai da máquina.
# ES: Ninguna estadística de uso sale de la máquina.
usage_report:
  reporting_enabled: false

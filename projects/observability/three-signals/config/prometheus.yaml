# EN: Prometheus normally pulls: it scrapes an HTTP endpoint of each target. In this lab the
#     metrics are pushed instead, by the collector, into the OTLP receiver of Prometheus
#     (enabled by the flag --web.enable-otlp-receiver in docker-compose.yml), so there is no
#     scrape configuration here.
# PT: O Prometheus normalmente puxa: ele raspa um endpoint HTTP de cada alvo. Neste laboratório
#     as métricas são empurradas, pelo collector, para o receptor OTLP do Prometheus (ligado
#     pela flag --web.enable-otlp-receiver no docker-compose.yml), então não há configuração
#     de scrape aqui.
# ES: Prometheus normalmente extrae (pull): hace scrape de un endpoint HTTP de cada objetivo. En este laboratorio
#     las métricas se empujan (push), por el collector, al receptor OTLP de Prometheus (activado
#     con la flag --web.enable-otlp-receiver en docker-compose.yml), así que aquí no hay configuración
#     de scrape.
global:
  evaluation_interval: 15s

otlp:
  # EN: `service.name` is a resource attribute. Promoting it turns it into the label
  #     `service_name` on every series, the same label Loki uses, so one dashboard variable
  #     filters metrics and logs alike.
  # PT: `service.name` é um atributo de resource. Promovê-lo o transforma no label
  #     `service_name` em toda série, o mesmo label que o Loki usa, então uma variável de
  #     dashboard filtra métricas e logs do mesmo jeito.
  # ES: `service.name` es un atributo de resource. Promoverlo lo convierte en el label
  #     `service_name` en toda serie, el mismo label que usa Loki, así que una variable de
  #     dashboard filtra métricas y logs de la misma manera.
  promote_resource_attributes:
    - service.name

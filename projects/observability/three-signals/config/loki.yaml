# EN: Loki in a single process, on the local file system. Loki indexes only the labels of a log
#     stream (here `service_name`), never the text of the lines, which is what keeps it cheap.
#     Fields that vary per request, such as the trace id, arrive as structured metadata: they
#     can be filtered but do not create new streams.
# PT: O Loki em um único processo, no sistema de arquivos local. O Loki indexa só os labels de
#     um stream de logs (aqui `service_name`), nunca o texto das linhas, e é isso que o mantém
#     barato. Campos que variam por requisição, como o trace id, chegam como structured
#     metadata: podem ser filtrados, mas não criam streams novos.
# ES: Loki en un solo proceso, sobre el sistema de archivos local. Loki indexa solo los labels de
#     un stream de logs (aquí `service_name`), nunca el texto de las líneas, y eso es lo que lo mantiene
#     barato. Los campos que varían por petición, como el trace id, llegan como structured
#     metadata: se pueden filtrar, pero no crean streams nuevos.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  retention_period: 24h

# EN: No usage statistics leave the machine.
# PT: Nenhuma estatística de uso sai da máquina.
# ES: Ninguna estadística de uso sale de la máquina.
analytics:
  reporting_enabled: false

# EN: Data sources as code: Grafana reads this file at start-up, so nobody clicks through a
#     settings page and the lab is the same on every machine. The fixed `uid` values are what
#     the dashboard JSON and the links between signals refer to.
# PT: Data sources como código: o Grafana lê este arquivo na inicialização, então ninguém
#     clica em uma tela de configuração e o laboratório é igual em toda máquina. Os valores
#     fixos de `uid` são o que o JSON do dashboard e os links entre sinais referenciam.
# ES: Data sources como código: Grafana lee este archivo al arrancar, así que nadie
#     hace clic en una pantalla de configuración y el laboratorio es igual en toda máquina. Los valores
#     fijos de `uid` son lo que el JSON del dashboard y los enlaces entre señales referencian.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # EN: From a log line to its trace: the trace id of each line becomes a link to Tempo.
      # PT: De uma linha de log para o seu trace: o trace id de cada linha vira um link para o Tempo.
      # ES: De una línea de log a su trace: el trace id de cada línea se vuelve un enlace a Tempo.
      derivedFields:
        - name: trace
          matcherType: label
          matcherRegex: trace_id
          url: "$${__value.raw}"
          datasourceUid: tempo
          urlDisplayLabel: Open trace

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      # EN: From a span to its logs: the button on a span runs this LogQL with the trace id.
      # PT: De um span para os seus logs: o botão em um span roda este LogQL com o trace id.
      # ES: De un span a sus logs: el botón en un span ejecuta este LogQL con el trace id.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        customQuery: true
        query: '{service_name=~".+"} | trace_id="$${__span.traceId}"'

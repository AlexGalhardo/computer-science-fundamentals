# EN: Dashboards as code: every JSON file in the folder below is loaded at start-up. The JSON
#     is reviewed and versioned like any other source file.
# PT: Dashboards como código: todo arquivo JSON da pasta abaixo é carregado na inicialização. O
#     JSON é revisado e versionado como qualquer outro arquivo de código.
# ES: Dashboards como código: todo archivo JSON de la carpeta de abajo se carga al arrancar. El
#     JSON se revisa y se versiona como cualquier otro archivo de código.
apiVersion: 1

providers:
  - name: three-signals
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards

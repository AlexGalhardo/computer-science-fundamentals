# EN: Security lab, defensive and educational. Two services built from the same pinned image:
#     `ts-test` runs the type check and the tests, `demo` prints the walk-through. The network is
#     internal: no container reaches the internet, and no port is published on the host. Both
#     APIs (vulnerable and fixed) run inside the container process, as the non-root `bun` user,
#     and only touch temporary folders they create themselves, with fake data only.
# PT: Laboratório de segurança, defensivo e educacional. Dois serviços feitos da mesma imagem
#     fixada: `ts-test` roda a checagem de tipos e os testes, `demo` imprime o passo a passo. A
#     rede é interna: nenhum contêiner alcança a internet, e nenhuma porta é publicada no host.
#     As duas APIs (vulnerável e corrigida) rodam dentro do processo do contêiner, como o usuário
#     não root `bun`, e só tocam em pastas temporárias que elas mesmas criam, só com dados falsos.
# ES: Laboratorio de seguridad, defensivo y educativo. Dos servicios hechos de la misma imagen
#     fijada: `ts-test` ejecuta la verificación de tipos y las pruebas, `demo` imprime el paso a paso. La
#     red es interna: ningún contenedor alcanza internet, y ningún puerto se publica en el host.
#     Las dos APIs (vulnerable y corregida) corren dentro del proceso del contenedor, como el usuario
#     no root `bun`, y solo tocan carpetas temporales que ellas mismas crean, solo con datos falsos.
name: sec-upload-path-traversal-lab

x-app: &app
  build: ./ts
  image: sef-upload-path-traversal-lab-ts:local
  networks:
    - lab

services:
  ts-test:
    <<: *app

  # EN: `docker compose run --rm demo` prints the flaws on the vulnerable API and then the same
  #     attempts blocked on the fixed one.
  # PT: `docker compose run --rm demo` imprime as falhas na API vulnerável e depois as mesmas
  #     tentativas bloqueadas na corrigida.
  # ES: `docker compose run --rm demo` imprime las fallas en la API vulnerable y luego los mismos
  #     intentos bloqueados en la corregida.
  demo:
    <<: *app
    command: ["bun", "run", "demo"]

networks:
  lab:
    internal: true

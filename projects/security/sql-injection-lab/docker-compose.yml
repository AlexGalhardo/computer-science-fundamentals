# EN: SQL injection lab: a PostgreSQL with fake data, and one image that holds the vulnerable
#     and the fixed ElysiaJS apps. The network is internal, so no container reaches the internet,
#     and NO port is published on the host: the apps are called in-process by the tests and by
#     the demo. Every credential below is fake and exists only inside this lab.
# PT: Laboratório de SQL injection: um PostgreSQL com dados falsos, e uma imagem que contém os
#     apps ElysiaJS vulnerável e corrigido. A rede é interna, então nenhum contêiner alcança a
#     internet, e NENHUMA porta é publicada no host: os apps são chamados em processo pelos
#     testes e pela demo. Toda credencial abaixo é falsa e existe só dentro deste laboratório.
# ES: Laboratorio de SQL injection: un PostgreSQL con datos falsos, y una imagen que contiene las
#     apps ElysiaJS vulnerable y corregida. La red es interna, así que ningún contenedor alcanza
#     internet, y NINGÚN puerto se publica en el host: las apps las llaman en proceso las
#     pruebas y la demo. Toda credencial de abajo es falsa y existe solo dentro de este laboratorio.
name: sec-sql-injection-lab

x-app: &app
  build: ./ts
  image: sef-sql-injection-lab-ts:local
  environment:
    # EN: The vulnerable app connects as the owner of the database (too much power).
    #     The fixed app connects with a role that can only read two tables.
    # PT: O app vulnerável conecta como dono do banco (poder demais).
    #     O app corrigido conecta com um papel que só lê duas tabelas.
    # ES: La app vulnerable se conecta como dueña de la base de datos (demasiado poder).
    #     La app corregida se conecta con un rol que solo lee dos tablas.
    OWNER_DATABASE_URL: postgres://lab_owner:lab-fake-owner-password@db:5432/lab
    READONLY_DATABASE_URL: postgres://lab_readonly:lab-fake-readonly-password@db:5432/lab
  depends_on:
    db:
      condition: service_healthy
  networks:
    - lab

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: lab_owner
      POSTGRES_PASSWORD: lab-fake-owner-password
      POSTGRES_DB: lab
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # EN: `-h 127.0.0.1` on purpose: while the seed runs, PostgreSQL listens only on a Unix
    #     socket, so the check turns healthy only after the seed has finished.
    # PT: `-h 127.0.0.1` de propósito: enquanto a carga inicial roda, o PostgreSQL escuta só em
    #     um socket Unix, então a checagem só fica saudável depois que a carga terminou.
    # ES: `-h 127.0.0.1` a propósito: mientras corre la carga inicial, PostgreSQL escucha solo en
    #     un socket Unix, así que la comprobación solo queda saludable después de que la carga terminó.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U lab_owner -d lab"]
      interval: 1s
      timeout: 3s
      retries: 30
    networks:
      - lab

  ts-test:
    <<: *app

  # EN: `docker compose run --rm demo` prints a narrated walk-through of the two flaws and fixes.
  # PT: `docker compose run --rm demo` imprime um passo a passo narrado das duas falhas e correções.
  # ES: `docker compose run --rm demo` imprime un paso a paso narrado de las dos fallas y correcciones.
  demo:
    <<: *app
    command: ["bun", "run", "demo"]

networks:
  lab:
    internal: true

# Go: gofmt decides the format (tabs). golangci-lint v2 runs the linters below.
# Copy of the configuration at the repository root, so the image needs only this folder.
# misspell is left out on purpose: comments here are bilingual, and it reports Portuguese
# words as misspelled English.
version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - revive
formatters:
  enable:
    - gofmt
    - goimports

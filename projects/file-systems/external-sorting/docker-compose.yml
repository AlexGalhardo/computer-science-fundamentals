# EN: Two services per language. `*-test` runs format check, linter and tests. `*-limit` runs
#     the memory-limit demo: the container gets 32 MiB of memory and no swap (memswap_limit
#     equal to mem_limit), and the program sorts a file of 320 MiB inside it. Every file the
#     programs create lives in /tmp inside the container, on disk, never in a tmpfs, because a
#     tmpfs would be charged to the memory limit.
# PT: Dois serviços por linguagem. `*-test` roda checagem de formato, linter e testes. `*-limit`
#     roda a demonstração do limite de memória: o contêiner recebe 32 MiB de memória e nenhum
#     swap (memswap_limit igual a mem_limit), e o programa ordena dentro dele um arquivo de
#     320 MiB. Todo arquivo que os programas criam fica em /tmp dentro do contêiner, em disco,
#     nunca em tmpfs, porque um tmpfs seria cobrado do limite de memória.
name: external-sorting

services:
  rust-test:
    build:
      context: .
      dockerfile: rust/Dockerfile
    image: sef-external-sorting-rust:local
    # Tests need no network, so the container gets none.
    network_mode: "none"
  go-test:
    build:
      context: .
      dockerfile: go/Dockerfile
    image: sef-external-sorting-go:local
    # Tests need no network, so the container gets none.
    network_mode: "none"
  rust-limit:
    image: sef-external-sorting-rust:local
    network_mode: "none"
    mem_limit: 32m
    memswap_limit: 32m
    command: ["extsort", "limit-check", "32"]
  go-limit:
    image: sef-external-sorting-go:local
    network_mode: "none"
    mem_limit: 32m
    memswap_limit: 32m
    command: ["extsort", "limit-check", "32"]

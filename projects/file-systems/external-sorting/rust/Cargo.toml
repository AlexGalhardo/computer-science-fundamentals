[package]
name = "external-sorting"
version = "0.1.0"
edition = "2024"

[dependencies]

[[bin]]
name = "extsort"
path = "src/main.rs"

# EN: The tests sort files with thousands of small runs. Optimising the test build keeps the
#     run short, and overflow checks stay on.
# PT: Os testes ordenam arquivos com milhares de runs pequenas. Otimizar o build de teste mantém
#     a execução curta, e as checagens de overflow continuam ligadas.
# ES: Las pruebas ordenan archivos con miles de runs pequeñas. Optimizar el build de prueba
#     mantiene la ejecución corta, y las comprobaciones de overflow siguen activadas.
[profile.dev]
opt-level = 2

# EN: One service per language. Each one builds a pinned image and runs format check, linter
#     and tests. Every file the programs create lives in /tmp inside the container.
# PT: Um serviço por linguagem. Cada um constrói uma imagem fixada e roda checagem de formato,
#     linter e testes. Todo arquivo que os programas criam fica em /tmp dentro do contêiner.
# ES: Un servicio por lenguaje. Cada uno construye una imagen fijada y ejecuta la comprobación
#     de formato, el linter y las pruebas. Todo archivo que crean los programas queda en /tmp
#     dentro del contenedor.
name: file-organisation

services:
  cpp-test:
    build:
      context: .
      dockerfile: cpp/Dockerfile
    image: sef-file-organisation-cpp:local
    # Tests need no network, so the container gets none.
    network_mode: "none"
  rust-test:
    build:
      context: .
      dockerfile: rust/Dockerfile
    image: sef-file-organisation-rust:local
    # Tests need no network, so the container gets none.
    network_mode: "none"

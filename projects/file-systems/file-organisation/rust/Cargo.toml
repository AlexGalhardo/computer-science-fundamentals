[package]
name = "file-organisation"
version = "0.1.0"
edition = "2024"

[dependencies]

[[bin]]
name = "demo"
path = "src/demo.rs"

# EN: The tests build files with thousands of records and compress them. Optimising the test
#     build keeps the run short, and overflow checks stay on.
# PT: Os testes montam arquivos com milhares de registros e os comprimem. Otimizar o build de
#     teste mantém a execução curta, e as checagens de overflow continuam ligadas.
# ES: Las pruebas montan archivos con miles de registros y los comprimen. Optimizar el build de
#     prueba mantiene la ejecución corta, y las comprobaciones de overflow siguen activadas.
[profile.dev]
opt-level = 2

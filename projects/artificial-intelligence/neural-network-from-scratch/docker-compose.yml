# EN: One image, two services: the tests and the demo. Plain Python with no dependency, so
#     nothing here needs the network.
# PT: Uma imagem, dois serviços: os testes e a demo. Python puro, sem dependências, então nada
#     aqui precisa de rede.
name: neural-network-from-scratch

services:
  python-test:
    build: ./python
    image: sef-neural-network-from-scratch-python:local
    network_mode: "none"

  # EN: The demo writes ./results on the host, so it runs as the host user: on Linux the
  #     mounted folder belongs to that user, and another uid would get "permission denied".
  # PT: A demo grava ./results no host, então roda como o usuário do host: no Linux a pasta
  #     montada pertence a esse usuário, e outro uid receberia "permission denied".
  python-demo:
    build: ./python
    image: sef-neural-network-from-scratch-python:local
    network_mode: "none"
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["python", "demo.py"]
    environment:
      RESULTS_DIR: /results
    volumes:
      - ./results:/results

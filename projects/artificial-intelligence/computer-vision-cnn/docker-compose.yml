# EN: One image (Python + PyTorch for CPU, pinned), two services: the tests and the demo.
# PT: Uma imagem (Python + PyTorch para CPU, fixados), dois serviços: os testes e a demo.
name: computer-vision-cnn

x-python: &python
  build: ./python
  image: sef-computer-vision-cnn-python:local
  # EN: Nothing is downloaded at run time (the shapes are drawn by the code), so no network.
  # PT: Nada é baixado em tempo de execução (as formas são desenhadas pelo código), então sem rede.
  network_mode: "none"

services:
  python-test:
    <<: *python

  # EN: The demo writes ./results on the host, so it runs as the host user: on Linux the mounted
  #     folder belongs to that user, and another uid would get "permission denied".
  # PT: A demo grava ./results no host, então roda como o usuário do host: no Linux a pasta
  #     montada pertence a esse usuário, e outro uid receberia "permission denied".
  python-demo:
    <<: *python
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["python", "demo.py"]
    environment:
      RESULTS_DIR: /results
    volumes:
      - ./results:/results

# EN: One test, one demo and one search service per language. Each language builds its own pinned
#     image. The corpus, the passages and the expected tables in ./data are mounted read-only
#     into both, so the two implementations are checked against the same files.
# PT: Um serviço de teste, um de demo e um de busca por linguagem. Cada linguagem constrói a sua
#     imagem fixada. O corpus, as passagens e as tabelas esperadas em ./data são montados só para
#     leitura nas duas, então as duas implementações são conferidas contra os mesmos arquivos.
# ES: Un servicio de pruebas, uno de demo y uno de búsqueda por lenguaje. Cada lenguaje construye
#     su imagen fijada. El corpus, los pasajes y las tablas esperadas en ./data se montan como solo
#     lectura en ambos, así que las dos implementaciones se comprueban contra los mismos archivos.
name: embeddings-vector-search

x-ts: &ts
  build: ./ts
  image: sef-embeddings-vector-search-ts:local
  # Nothing here needs the network, so the containers get none.
  network_mode: "none"
  environment:
    DATA_DIR: /data
    RESULTS_DIR: /results

x-python: &python
  build: ./python
  image: sef-embeddings-vector-search-python:local
  network_mode: "none"
  environment:
    DATA_DIR: /data
    RESULTS_DIR: /results

services:
  ts-test:
    <<: *ts
    volumes:
      - ./data:/data:ro

  python-test:
    <<: *python
    volumes:
      - ./data:/data:ro

  # EN: The demos write ./results on the host, so they run as the host user: on Linux the
  #     mounted folder belongs to that user, and another uid would get "permission denied".
  # PT: As demos gravam ./results no host, então rodam como o usuário do host: no Linux a pasta
  #     montada pertence a esse usuário, e outro uid receberia "permission denied".
  # ES: Las demos escriben ./results en el host, así que se ejecutan como el usuario del host: en
  #     Linux la carpeta montada pertenece a ese usuario, y otro uid recibiría "permission denied".
  ts-demo:
    <<: *ts
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["bun", "run", "src/demo.ts"]
    volumes:
      - ./data:/data:ro
      - ./results:/results

  python-demo:
    <<: *python
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["python", "demo.py"]
    volumes:
      - ./data:/data:ro
      - ./results:/results

  # EN: docker compose run --rm ts-search "your question"   (or python-search)
  # PT: docker compose run --rm ts-search "sua pergunta"    (ou python-search)
  # ES: docker compose run --rm ts-search "tu pregunta"      (o python-search)
  ts-search:
    <<: *ts
    entrypoint: ["bun", "run", "src/cli.ts"]
    volumes:
      - ./data:/data:ro

  python-search:
    <<: *python
    entrypoint: ["python", "cli.py"]
    volumes:
      - ./data:/data:ro

  # EN: Rewrites data/corpus.txt, data/queries.txt and data/groups.json from the seeded generator.
  #     Not part of the setup script: the files are committed, and the tests check that the
  #     generator still writes the same bytes.
  # PT: Regrava data/corpus.txt, data/queries.txt e data/groups.json a partir do gerador com
  #     semente. Não faz parte do script de setup: os arquivos são versionados, e os testes
  #     conferem que o gerador ainda escreve os mesmos bytes.
  # ES: Reescribe data/corpus.txt, data/queries.txt y data/groups.json a partir del generador con
  #     semilla. No forma parte del script de setup: los archivos están versionados, y las pruebas
  #     comprueban que el generador sigue escribiendo los mismos bytes.
  ts-corpus:
    <<: *ts
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["bun", "run", "src/generate-corpus.ts"]
    volumes:
      - ./data:/data

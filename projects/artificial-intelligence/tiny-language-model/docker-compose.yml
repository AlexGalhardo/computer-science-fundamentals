# EN: One image, two services: the tests and the demo. Nothing here needs the network (the
#     corpus is generated by the code, no dataset is downloaded), so the containers get none.
# PT: Uma imagem, dois serviços: os testes e a demo. Nada aqui precisa de rede (o corpus é
#     gerado pelo código, nenhum conjunto de dados é baixado), então os containers ficam sem.
# ES: Una imagen, dos servicios: las pruebas y la demo. Nada aquí necesita red (el corpus lo genera
#     el código, no se descarga ningún conjunto de datos), así que los contenedores quedan sin ella.
name: tiny-language-model

x-python: &python
  build: ./python
  image: sef-tiny-language-model-python:local
  network_mode: "none"
  environment:
    RESULTS_DIR: /results

services:
  python-test:
    <<: *python

  # EN: The demo writes ./results on the host, so it runs as the host user: on Linux the
  #     mounted folder belongs to that user, and another uid would get "permission denied".
  # PT: A demo grava ./results no host, então roda como o usuário do host: no Linux a pasta
  #     montada pertence a esse usuário, e outro uid receberia "permission denied".
  # ES: La demo escribe ./results en el host, así que se ejecuta como el usuario del host: en Linux
  #     la carpeta montada pertenece a ese usuario, y otro uid recibiría "permission denied".
  python-demo:
    <<: *python
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["python", "demo.py"]
    volumes:
      - ./results:/results

# EN: One image, two services: the tests and the demo. The image is pinned, and nothing here needs
#     the network (the data is generated with a fixed seed), so the containers get none.
# PT: Uma imagem, dois serviços: os testes e a demo. A imagem é fixada, e nada aqui precisa de
#     rede (os dados são gerados com semente fixa), então os containers ficam sem nenhuma.
name: diffusion-toy

x-python: &python
  build: ./python
  image: sef-diffusion-toy-python:local
  network_mode: "none"
  environment:
    RESULTS_DIR: /results

services:
  python-test:
    <<: *python

  # EN: The demo writes ./results on the host, so it runs as the host user: on Linux the mounted
  #     folder belongs to that user, and another uid would get "permission denied".
  # PT: A demo grava ./results no host, então roda como o usuário do host: no Linux a pasta
  #     montada pertence a esse usuário, e outro uid receberia "permission denied".
  python-demo:
    <<: *python
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["python", "demo.py"]
    volumes:
      - ./results:/results

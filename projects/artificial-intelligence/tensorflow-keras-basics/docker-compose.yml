# EN: One image, two services: the tests and the demo. TensorFlow is installed when the image
#     is built, so nothing here needs the network at run time.
# PT: Uma imagem, dois serviços: os testes e a demo. O TensorFlow é instalado quando a imagem é
#     construída, então nada aqui precisa de rede em tempo de execução.
# ES: Una imagen, dos servicios: las pruebas y la demo. TensorFlow se instala cuando se construye la
#     imagen, así que nada aquí necesita red en tiempo de ejecución.
name: tensorflow-keras-basics

services:
  python-test:
    build: ./python
    image: sef-tensorflow-keras-basics-python:local
    network_mode: "none"

  # EN: The demo writes ./results on the host, so it runs as the host user: on Linux the
  #     mounted folder belongs to that user, and another uid would get "permission denied".
  # PT: A demo grava ./results no host, então roda como o usuário do host: no Linux a pasta
  #     montada pertence a esse usuário, e outro uid receberia "permission denied".
  # ES: La demo escribe ./results en el host, así que se ejecuta como el usuario del host: en Linux
  #     la carpeta montada pertenece a ese usuario, y otro uid recibiría "permission denied".
  python-demo:
    build: ./python
    image: sef-tensorflow-keras-basics-python:local
    network_mode: "none"
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["python", "demo.py"]
    environment:
      RESULTS_DIR: /results
    volumes:
      - ./results:/results

[pytest]
# EN: `tf.function` rewrites Python code with the library gast, which TensorFlow 2.21.0 installs.
#     On Python 3.13 that library prints a DeprecationWarning for every node it creates (dozens
#     per run). The warning is about gast's own internals, not about this project, so it is
#     hidden here. Nothing else is filtered.
# PT: O `tf.function` reescreve código Python com a biblioteca gast, que o TensorFlow 2.21.0
#     instala. No Python 3.13 essa biblioteca imprime um DeprecationWarning para cada nó que
#     cria (dezenas por execução). O aviso é sobre o funcionamento interno da gast, não sobre
#     este projeto, então é escondido aqui. Nada mais é filtrado.
filterwarnings =
    ignore:.*got an unexpected keyword argument '___pyct_anno'.*:DeprecationWarning

# EN: One image, two services: the tests and the demo. PyTorch is installed when the image is
#     built (the CPU-only wheel), so nothing here needs the network at run time.
# PT: Uma imagem, dois serviços: os testes e a demo. O PyTorch é instalado quando a imagem é
#     construída (o pacote só de CPU), então nada aqui precisa de rede em tempo de execução.
name: pytorch-basics

services:
  python-test:
    build: ./python
    image: sef-pytorch-basics-python:local
    network_mode: "none"

  # EN: The demo writes ./results on the host, so it runs as the host user: on Linux the
  #     mounted folder belongs to that user, and another uid would get "permission denied".
  # PT: A demo grava ./results no host, então roda como o usuário do host: no Linux a pasta
  #     montada pertence a esse usuário, e outro uid receberia "permission denied".
  python-demo:
    build: ./python
    image: sef-pytorch-basics-python:local
    network_mode: "none"
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["python", "demo.py"]
    environment:
      RESULTS_DIR: /results
    volumes:
      - ./results:/results

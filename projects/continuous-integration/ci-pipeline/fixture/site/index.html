<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Sample quiz</title>
		<!-- EN: A one-page stand-in for the quiz. The end-to-end demo serves it from a container
		     and Playwright drives a real browser against it.
		     PT: Um substituto de uma página para o quiz. A demo de ponta a ponta o serve de um
		     contêiner e o Playwright conduz um navegador de verdade contra ele.
		     ES: Un sustituto de una página para el quiz. La demo de punta a punta lo sirve desde
		     un contenedor y Playwright maneja un navegador real contra él. -->
	</head>
	<body>
		<h1>Sample quiz</h1>
		<button id="start" type="button">Start</button>
		<p id="question" hidden>What does CI stand for?</p>
		<script>
			document.getElementById("start").addEventListener("click", () => {
				document.getElementById("question").hidden = false;
			});
		</script>
	</body>
</html>

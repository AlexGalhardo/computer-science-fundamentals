# EN: One test service and one demo service per language. Each language builds one pinned
#     image, and every container runs with no network: nothing here needs to reach anything.
# PT: Um serviço de teste e um de demo por linguagem. Cada linguagem constrói uma imagem
#     fixada, e todo contêiner roda sem rede: nada aqui precisa alcançar coisa alguma.
name: counter-race

x-go: &go
  build: { context: ., dockerfile: go/Dockerfile }
  image: sef-counter-race-go:local
  network_mode: "none"
x-rust: &rust
  build: { context: ., dockerfile: rust/Dockerfile }
  image: sef-counter-race-rust:local
  network_mode: "none"
x-java: &java
  build: { context: ., dockerfile: java/Dockerfile }
  image: sef-counter-race-java:local
  network_mode: "none"
x-ts: &ts
  build: { context: ., dockerfile: ts/Dockerfile }
  image: sef-counter-race-ts:local
  network_mode: "none"
x-elixir: &elixir
  build: { context: ., dockerfile: elixir/Dockerfile }
  image: sef-counter-race-elixir:local
  network_mode: "none"

services:
  go-test:
    <<: *go
  go-demo:
    <<: *go
    command: ["counter-race-go"]
  rust-test:
    <<: *rust
  rust-demo:
    <<: *rust
    command: ["counter-race-rust"]
  java-test:
    <<: *java
  java-demo:
    <<: *java
    command: ["counter-race-java"]
  ts-test:
    <<: *ts
  ts-demo:
    <<: *ts
    command: ["counter-race-ts"]
  elixir-test:
    <<: *elixir
  elixir-demo:
    <<: *elixir
    command: ["counter-race-elixir"]

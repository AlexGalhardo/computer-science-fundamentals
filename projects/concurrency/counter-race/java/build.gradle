// EN: Gradle is used for three things only: compiling with every warning as an error, checking
//     the format with Spotless (google-java-format), and downloading the Error Prone compiler
//     plugin, which is the static race checker of this mini-project. Versions are pinned.
// PT: O Gradle é usado só para três coisas: compilar com todo aviso virando erro, conferir o
//     formato com o Spotless (google-java-format) e baixar o plugin de compilador Error Prone,
//     que é o verificador estático de corrida deste mini-projeto. As versões são fixas.
plugins {
	id "java"
	id "com.diffplug.spotless" version "8.10.3"
}

repositories {
	mavenCentral()
}

configurations {
	errorprone
}

dependencies {
	errorprone "com.google.errorprone:error_prone_core:2.50.0"
	// EN: Only the @GuardedBy annotation. It is read by the compiler and absent at run time.
	// PT: Só a anotação @GuardedBy. Ela é lida pelo compilador e não existe em tempo de execução.
	compileOnly "com.google.errorprone:error_prone_annotations:2.50.0"
	testCompileOnly "com.google.errorprone:error_prone_annotations:2.50.0"
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
	options.compilerArgs += ["-Xlint:all", "-Werror"]
}

// Same rules as docker/java/spotless.gradle, which is outside the Docker build context.
spotless {
	java {
		target "src/**/*.java"
		googleJavaFormat()
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

// EN: Copies the Error Prone jars to build/errorprone, where check-guarded-by.sh finds them.
// PT: Copia os jars do Error Prone para build/errorprone, onde o check-guarded-by.sh os encontra.
tasks.register("copyErrorProne", Copy) {
	from configurations.errorprone
	into layout.buildDirectory.dir("errorprone")
}

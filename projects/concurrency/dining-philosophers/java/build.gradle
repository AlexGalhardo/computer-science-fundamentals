// EN: Gradle is used for two things only: compiling with every warning as an error and checking
//     the format with Spotless (google-java-format). The project has no library dependency.
// PT: O Gradle é usado só para duas coisas: compilar com todo aviso virando erro e conferir o
//     formato com o Spotless (google-java-format). O projeto não tem dependência de biblioteca.
// ES: Gradle se usa solo para dos cosas: compilar con toda advertencia convertida en error y
//     comprobar el formato con Spotless (google-java-format). El proyecto no tiene dependencias de biblioteca.
plugins {
	id "java"
	id "com.diffplug.spotless" version "8.10.3"
}

repositories {
	mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
	options.compilerArgs += ["-Xlint:all", "-Werror"]
}

// Same rules as docker/java/spotless.gradle, which is outside the Docker build context.
spotless {
	java {
		target "src/**/*.java"
		googleJavaFormat()
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

# EN: One test service and one demo service per language. Each language builds one pinned
#     image, and every container runs with no network: nothing here needs to reach anything.
# PT: Um serviço de teste e um de demo por linguagem. Cada linguagem constrói uma imagem
#     fixada, e todo contêiner roda sem rede: nada aqui precisa alcançar coisa alguma.
name: dining-philosophers

x-go: &go
  build: { context: ., dockerfile: go/Dockerfile }
  image: sef-dining-philosophers-go:local
  network_mode: "none"
x-java: &java
  build: { context: ., dockerfile: java/Dockerfile }
  image: sef-dining-philosophers-java:local
  network_mode: "none"

services:
  go-test:
    <<: *go
  go-demo:
    <<: *go
    command: ["philosophers-go"]
  # Freezes the naive table and prints the stack of every goroutine.
  go-dump:
    <<: *go
    command: ["philosophers-go", "naive", "--dump"]
  java-test:
    <<: *java
  java-demo:
    <<: *java
    command: ["philosophers-java"]
  # Freezes the naive table and prints the jstack thread dump, with the deadlock report.
  java-dump:
    <<: *java
    command: ["sh", "capture-dump.sh"]

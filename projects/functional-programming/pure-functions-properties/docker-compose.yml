# EN: One test service and one demo service per language. The build context is this folder,
#     so both images see the shared cases.json. Nothing here needs the network, so every
#     container gets none.
# PT: Um serviço de teste e um de demonstração por linguagem. O contexto de build é esta
#     pasta, então as duas imagens enxergam o cases.json compartilhado. Nada aqui precisa de
#     rede, então nenhum contêiner a recebe.
name: pure-functions-properties

services:
  ts-test:
    build:
      context: .
      dockerfile: ts/Dockerfile
    image: sef-pure-functions-properties-ts:local
    network_mode: "none"

  ts-demo:
    build:
      context: .
      dockerfile: ts/Dockerfile
    image: sef-pure-functions-properties-ts:local
    network_mode: "none"
    command: ["bun", "run", "demo"]

  elixir-test:
    build:
      context: .
      dockerfile: elixir/Dockerfile
    image: sef-pure-functions-properties-elixir:local
    network_mode: "none"

  elixir-demo:
    build:
      context: .
      dockerfile: elixir/Dockerfile
    image: sef-pure-functions-properties-elixir:local
    network_mode: "none"
    command: ["mix", "demo"]

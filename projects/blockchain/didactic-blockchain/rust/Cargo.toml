[package]
name = "didactic-blockchain"
version = "0.1.0"
edition = "2024"

# EN: No dependencies on purpose. SHA-256 is written by hand in src/sha256.rs.
# PT: Sem dependências de propósito. O SHA-256 é escrito à mão em src/sha256.rs.
[dependencies]

# EN: The tests hash a few hundred thousand headers. Optimising them keeps the run in seconds.
# PT: Os testes calculam o hash de algumas centenas de milhares de cabeçalhos. Otimizá-los
#     mantém a execução em segundos.
[profile.test]
opt-level = 2

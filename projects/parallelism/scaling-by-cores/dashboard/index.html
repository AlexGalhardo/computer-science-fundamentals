<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Scaling by cores</title>
		<!-- EN: Built CSS is committed, so the page needs no CDN and no network.
		     PT: O CSS compilado é versionado, então a página não precisa de CDN nem de rede.
		     ES: El CSS compilado está versionado, así que la página no necesita CDN ni red. -->
		<link rel="stylesheet" href="tailwind.css" />
	</head>
	<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
		<main class="mx-auto max-w-4xl px-4 py-8">
			<h1 class="text-2xl font-bold">Scaling by cores: <span id="project">...</span></h1>
			<p id="status" class="mt-1 text-sm text-slate-600 dark:text-slate-300"></p>

			<form class="mt-6 grid gap-4 sm:grid-cols-3">
				<label class="flex flex-col gap-1 text-sm font-semibold">
					Workload
					<select id="workload" class="min-h-11 rounded border border-slate-400 bg-white px-2 font-normal dark:bg-slate-900"></select>
				</label>
				<label class="flex flex-col gap-1 text-sm font-semibold">
					Schedule
					<select id="schedule" class="min-h-11 rounded border border-slate-400 bg-white px-2 font-normal dark:bg-slate-900"></select>
				</label>
				<label class="flex flex-col gap-1 text-sm font-semibold">
					Metric
					<select id="metric" class="min-h-11 rounded border border-slate-400 bg-white px-2 font-normal dark:bg-slate-900">
						<option value="speedup">speed-up</option>
						<option value="efficiency">efficiency</option>
					</select>
				</label>
			</form>

			<section class="mt-6 rounded-lg border border-slate-300 bg-white p-4 dark:border-slate-700 dark:bg-slate-900">
				<div id="chart"></div>
			</section>

			<section class="mt-6 overflow-x-auto rounded-lg border border-slate-300 bg-white p-4 dark:border-slate-700 dark:bg-slate-900">
				<div id="table"></div>
			</section>

			<section class="mt-6 text-sm">
				<h2 class="text-lg font-semibold">Machine and runtimes</h2>
				<dl id="machine" class="mt-2"></dl>
			</section>
		</main>
		<script src="../results/results.js"></script>
		<script src="dashboard.js"></script>
	</body>
</html>

# EN: One test service and one demo service per language, plus the diagram generator. The build
#     context is this folder, so both images see the shared machine.json and diagram.md.
#     Nothing here needs the network, so every container gets none.
# PT: Um serviço de teste e um de demonstração por linguagem, mais o gerador do diagrama. O
#     contexto de build é esta pasta, então as duas imagens enxergam machine.json e diagram.md
#     compartilhados. Nada aqui precisa de rede, então nenhum contêiner a recebe.
name: order-state-machine

services:
  ts-test:
    build:
      context: .
      dockerfile: ts/Dockerfile
    image: sef-order-state-machine-ts:local
    network_mode: "none"

  # EN: To walk your own order: docker compose run --rm ts-demo bun run order pay ship deliver
  # PT: Para conduzir o seu pedido: docker compose run --rm ts-demo bun run order pay ship deliver
  ts-demo:
    build:
      context: .
      dockerfile: ts/Dockerfile
    image: sef-order-state-machine-ts:local
    network_mode: "none"
    command: ["bun", "run", "demo"]

  # EN: Regenerates diagram.md on the host from the machine.json of the host, so an edit to the
  #     table needs no rebuild before the diagram is refreshed.
  # PT: Regenera diagram.md no host a partir do machine.json do host, então uma edição na tabela
  #     não exige reconstruir a imagem antes de atualizar o diagrama.
  ts-diagram:
    build:
      context: .
      dockerfile: ts/Dockerfile
    image: sef-order-state-machine-ts:local
    network_mode: "none"
    command: ["bun", "run", "diagram"]
    environment:
      DIAGRAM_OUT: /app/diagram.md
    volumes:
      - ./machine.json:/app/machine.json:ro
      - ./diagram.md:/app/diagram.md

  elixir-test:
    build:
      context: .
      dockerfile: elixir/Dockerfile
    image: sef-order-state-machine-elixir:local
    network_mode: "none"

  # EN: To walk your own order: docker compose run --rm elixir-demo mix order pay ship deliver
  # PT: Para conduzir o seu pedido: docker compose run --rm elixir-demo mix order pay ship deliver
  elixir-demo:
    build:
      context: .
      dockerfile: elixir/Dockerfile
    image: sef-order-state-machine-elixir:local
    network_mode: "none"
    command: ["mix", "order", "demo"]

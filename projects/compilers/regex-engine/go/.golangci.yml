# EN: Copy of the repository's `.golangci.yml`, needed here because the Docker build context is
#     this folder. One addition: `misspell` only knows English, so it reports Portuguese words of
#     the bilingual comments as typos of English ones ("exponencial" -> "exponential"). The words
#     it trips on are listed below instead of turning the linter off.
# PT: Cópia do `.golangci.yml` do repositório, necessária aqui porque o contexto de build do
#     Docker é esta pasta. Um acréscimo: o `misspell` só conhece inglês, então reporta palavras
#     em português dos comentários bilíngues como erros de digitação de palavras inglesas
#     ("exponencial" -> "exponential"). As palavras em que ele tropeça estão listadas abaixo, em
#     vez de desligar o linter.
# ES: Copia del `.golangci.yml` del repositorio, necesaria aquí porque el contexto de build de
#     Docker es esta carpeta. Un agregado: `misspell` solo conoce el inglés, así que reporta
#     palabras en español de los comentarios multilingües como errores de tipeo de palabras
#     inglesas ("exponencial" -> "exponential"). Las palabras en las que tropieza están listadas
#     abajo, en lugar de desactivar el linter.
version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - revive
  settings:
    misspell:
      ignore-rules:
        - exponencial
        - independente
        - intervalos
        - respondendo
        # EN: Spanish words of the comments, read as "patrons" and "memento".
        # PT: Palavras em espanhol dos comentários, lidas como "patrons" e "memento".
        # ES: Palabras en español de los comentarios, leídas como "patrons" y "memento".
        - patrones
        - momento
formatters:
  enable:
    - gofmt
    - goimports

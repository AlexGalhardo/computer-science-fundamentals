# EN: One service checks the Go module (formatter, vet, linter, tests) and another runs the
#     compiled command. Both use the same pinned image.
# PT: Um serviço verifica o módulo em Go (formatador, vet, linter, testes) e outro executa o
#     comando compilado. Os dois usam a mesma imagem fixada.
# ES: Un servicio verifica el módulo en Go (formateador, vet, linter, pruebas) y otro ejecuta el
#     comando compilado. Ambos usan la misma imagen fijada.
name: regex-engine

services:
  go-test:
    build: ./go
    image: sef-regex-engine-go:local
    # Tests need no network, so the container gets none.
    network_mode: "none"

  # EN: docker compose run --rm regex match "(a|b)*abb" babb
  #     docker compose run --rm regex dot dfa "(a|b)*abb"
  # PT: docker compose run --rm regex match "(a|b)*abb" babb
  #     docker compose run --rm regex dot dfa "(a|b)*abb"
  # ES: docker compose run --rm regex match "(a|b)*abb" babb
  #     docker compose run --rm regex dot dfa "(a|b)*abb"
  regex:
    build: ./go
    image: sef-regex-engine-go:local
    network_mode: "none"
    entrypoint: ["regex-engine"]
    command: ["match", "(a|b)*abb", "babb"]

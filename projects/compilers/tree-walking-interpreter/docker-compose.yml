# EN: One service runs the tests and another starts the REPL. Both use the same pinned image.
# PT: Um serviço roda os testes e outro inicia o REPL. Os dois usam a mesma imagem fixada.
# ES: Un servicio ejecuta las pruebas y otro inicia el REPL. Ambos usan la misma imagen fijada.
name: tree-walking-interpreter

services:
  ts-test:
    build:
      context: .
      dockerfile: ts/Dockerfile
    image: sef-tree-walking-interpreter-ts:local
    # Tests need no network, so the container gets none.
    network_mode: "none"

  # EN: Interactive: docker compose run --rm ts-repl
  #     One file:    docker compose run --rm ts-repl bun run mini ../examples/closures.mini
  # PT: Interativo:  docker compose run --rm ts-repl
  #     Um arquivo:  docker compose run --rm ts-repl bun run mini ../examples/closures.mini
  # ES: Interactivo: docker compose run --rm ts-repl
  #     Un archivo:  docker compose run --rm ts-repl bun run mini ../examples/closures.mini
  ts-repl:
    build:
      context: .
      dockerfile: ts/Dockerfile
    image: sef-tree-walking-interpreter-ts:local
    network_mode: "none"
    stdin_open: true
    tty: true
    command: ["bun", "run", "mini"]

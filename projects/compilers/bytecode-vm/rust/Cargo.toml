[package]
name = "bytecode-vm"
version = "0.1.0"
edition = "2024"

[dependencies]

# EN: The dispatch loop of the virtual machine is one big function that calls many tiny ones.
#     Compiling the crate as a single unit with link-time optimisation lets the compiler inline
#     them into the loop.
# PT: O laço de despacho da máquina virtual é uma função grande que chama muitas funções
#     minúsculas. Compilar o crate como uma única unidade com otimização em tempo de ligação
#     permite ao compilador embuti-las no laço.
[profile.release]
codegen-units = 1
lto = true

# EN: One service checks the Rust crate (formatter, linter, tests) and another runs the compiled
#     binary. Both use the same pinned image, whose build context is the project folder because
#     the tests read `examples/`.
# PT: Um serviço verifica o crate em Rust (formatador, linter, testes) e outro executa o binário
#     compilado. Os dois usam a mesma imagem fixada, cujo contexto de build é a pasta do projeto
#     porque os testes leem `examples/`.
# ES: Un servicio verifica el crate en Rust (formateador, linter, pruebas) y otro ejecuta el
#     binario compilado. Ambos usan la misma imagen fijada, cuyo contexto de build es la carpeta
#     del proyecto porque las pruebas leen `examples/`.
name: bytecode-vm

services:
  rust-test:
    build:
      context: .
      dockerfile: rust/Dockerfile
    image: sef-bytecode-vm-rust:local
    # Tests need no network, so the container gets none.
    network_mode: "none"

  # EN: docker compose run --rm vm run ../examples/closures.mini
  #     docker compose run --rm vm disasm ../examples/closures.mini
  # PT: docker compose run --rm vm run ../examples/closures.mini
  #     docker compose run --rm vm disasm ../examples/closures.mini
  # ES: docker compose run --rm vm run ../examples/closures.mini
  #     docker compose run --rm vm disasm ../examples/closures.mini
  vm:
    build:
      context: .
      dockerfile: rust/Dockerfile
    image: sef-bytecode-vm-rust:local
    network_mode: "none"
    entrypoint: ["/app/rust/target/release/bytecode-vm"]
    command: ["disasm", "../examples/closures.mini"]

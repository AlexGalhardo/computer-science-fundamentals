# EN: One test service and one demo service per language. The build context is this folder for
#     both, because programs/ and results/trace.txt are shared by the two implementations.
# PT: Um serviço de teste e um de demo por linguagem. O contexto de build é esta pasta para os
#     dois, porque programs/ e results/trace.txt são compartilhados pelas duas implementações.
name: nand-alu-cpu

services:
  go-test:
    build:
      context: .
      dockerfile: go/Dockerfile
    image: sef-nand-alu-cpu-go:local
    # Tests need no network, so the container gets none.
    network_mode: "none"

  ts-test:
    build:
      context: .
      dockerfile: ts/Dockerfile
    image: sef-nand-alu-cpu-ts:local
    # Tests need no network, so the container gets none.
    network_mode: "none"

  # EN: Each demo runs programs/multiply.asm and writes the trace to ./results/trace.txt on the
  #     host. Both write the same file with the same bytes.
  # PT: Cada demo executa programs/multiply.asm e grava o trace em ./results/trace.txt no host.
  #     As duas gravam o mesmo arquivo com os mesmos bytes.
  ts-demo:
    build:
      context: .
      dockerfile: ts/Dockerfile
    image: sef-nand-alu-cpu-ts:local
    network_mode: "none"
    command: ["bun", "run", "demo"]
    environment:
      RESULTS_DIR: /results
    volumes:
      - ./results:/results

  go-demo:
    build:
      context: .
      dockerfile: go/Dockerfile
    image: sef-nand-alu-cpu-go:local
    network_mode: "none"
    command: ["nand-cpu-demo"]
    environment:
      RESULTS_DIR: /results
    volumes:
      - ./results:/results

# Go: gofmt decides the format (tabs). golangci-lint v2 runs the linters below.
# Copy of the repository configuration, so that the Docker build context is self-contained.
version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - revive
  settings:
    misspell:
      # EN: misspell only knows English. These are correct Spanish words from the comments
      #     ("columnas" = columns, "versiones" = versions) that it takes for English typos.
      # PT: O misspell só conhece inglês. Estas são palavras corretas em espanhol, vindas dos
      #     comentários, que ele confunde com erros de digitação em inglês.
      # ES: misspell solo conoce inglés. Estas son palabras correctas en español, tomadas de
      #     los comentarios, que confunde con errores de escritura en inglés.
      ignore-rules:
        - calcularon
        - columnas
        - implementaciones
        - versiones
        - directos
formatters:
  enable:
    - gofmt
    - goimports

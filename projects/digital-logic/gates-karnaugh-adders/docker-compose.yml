# EN: One test service and one demo service per language. Each language has its own pinned image.
# PT: Um serviço de teste e um de demo por linguagem. Cada linguagem tem sua imagem fixada.
# ES: Un servicio de prueba y uno de demo por lenguaje. Cada lenguaje tiene su imagen fijada.
name: gates-karnaugh-adders

services:
  ts-test:
    build: ./ts
    image: sef-gates-karnaugh-adders-ts:local
    # Tests need no network, so the container gets none.
    network_mode: "none"

  python-test:
    build: ./python
    image: sef-gates-karnaugh-adders-python:local
    # Tests need no network, so the container gets none.
    network_mode: "none"

  # EN: The demos print their report and write it to ./results on the host.
  # PT: As demos imprimem seu relatório e o gravam em ./results no host.
  # ES: Las demos imprimen su informe y lo escriben en ./results en el host.
  ts-demo:
    build: ./ts
    image: sef-gates-karnaugh-adders-ts:local
    network_mode: "none"
    command: ["bun", "run", "demo"]
    environment:
      RESULTS_DIR: /results
    volumes:
      - ./results:/results

  python-demo:
    build: ./python
    image: sef-gates-karnaugh-adders-python:local
    network_mode: "none"
    command: ["python", "demo.py"]
    environment:
      RESULTS_DIR: /results
    volumes:
      - ./results:/results

# Go: gofmt decides the format (tabs). golangci-lint v2 runs the linters below.
# Copy of the repository configuration, so that the Docker build context is self-contained.
version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - revive
  settings:
    misspell:
      # EN: misspell only knows English. These are correct Portuguese words from the bilingual
      #     comments ("processos" = processes, "eles" = they) that it takes for English typos.
      # PT: O misspell só conhece inglês. Estas são palavras corretas em português, vindas dos
      #     comentários bilíngues, que ele confunde com erros de digitação em inglês.
      ignore-rules:
        - processos
        - eles
formatters:
  enable:
    - gofmt
    - goimports

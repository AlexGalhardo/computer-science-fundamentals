# EN: One service per language. Each one builds a pinned image and runs its tests.
# PT: Um serviço por linguagem. Cada um constrói uma imagem fixada e roda seus testes.
name: deadlock-mini-shell

services:
  go-test:
    build: ./go
    image: sef-deadlock-mini-shell-go:local
    # Tests need no network, so the container gets none.
    network_mode: "none"
  cpp-test:
    build: ./cpp
    image: sef-deadlock-mini-shell-cpp:local
    # Tests need no network, so the container gets none.
    network_mode: "none"
  # EN: Classifies the documented graphs and states and writes results/results.md.
  # PT: Classifica os grafos e estados documentados e grava results/results.md.
  demo:
    build: ./go
    image: sef-deadlock-mini-shell-go:local
    network_mode: "none"
    command: ["sh", "-c", "deadlock-demo && deadlock-demo -markdown > /results/results.md"]
    volumes:
      - ./results:/results
  # EN: Runs a sample script with the mini shell.
  # PT: Executa um script de exemplo com o mini shell.
  shell-demo:
    build: ./cpp
    image: sef-deadlock-mini-shell-cpp:local
    network_mode: "none"
    command: ["./msh", "demo.msh"]
  # EN: An interactive mini shell: docker compose run --rm shell
  # PT: Um mini shell interativo: docker compose run --rm shell
  shell:
    build: ./cpp
    image: sef-deadlock-mini-shell-cpp:local
    network_mode: "none"
    command: ["./msh"]
    stdin_open: true
    tty: true

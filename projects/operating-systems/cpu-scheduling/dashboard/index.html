<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>CPU scheduling simulator</title>
		<!-- EN: Built CSS is committed, so the page needs no CDN and no network.
		     PT: O CSS compilado é versionado, então a página não precisa de CDN nem de rede.
		     ES: El CSS compilado está versionado, así que la página no necesita CDN ni red. -->
		<link rel="stylesheet" href="tailwind.css" />
	</head>
	<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
		<main class="mx-auto max-w-4xl px-4 py-8">
			<h1 class="text-2xl font-bold">CPU scheduling simulator</h1>
			<p id="status" class="mt-1 text-sm text-slate-600 dark:text-slate-300"></p>

			<section class="mt-6">
				<h2 class="text-lg font-semibold">Gantt charts of the example</h2>
				<p id="example" class="mt-1 text-sm text-slate-600 dark:text-slate-300"></p>
				<div id="charts" class="mt-4 grid gap-4"></div>
			</section>

			<section class="mt-8">
				<h2 class="text-lg font-semibold">Comparison on generated workloads</h2>
				<label class="mt-2 flex max-w-xs flex-col gap-1 text-sm font-semibold">
					Workload
					<select id="workload" class="min-h-11 rounded border border-slate-400 bg-white px-2 font-normal dark:bg-slate-900"></select>
				</label>
				<div id="table" class="mt-4 overflow-x-auto rounded-lg border border-slate-300 bg-white p-4 dark:border-slate-700 dark:bg-slate-900"></div>
				<p class="mt-2 text-sm text-slate-600 dark:text-slate-300">
					Times are abstract units. Lower is better in every column. The bar shows the value relative to the worst policy of
					the column.
				</p>
			</section>
		</main>
		<script src="../results/results.js"></script>
		<script src="dashboard.js"></script>
	</body>
</html>

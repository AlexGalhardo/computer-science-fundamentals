# EN: One service per language. Each one builds a pinned image and runs its tests.
# PT: Um serviço por linguagem. Cada um constrói uma imagem fixada e roda seus testes.
# ES: Un servicio por lenguaje. Cada uno construye una imagen fijada y ejecuta sus pruebas.
name: cpu-scheduling

services:
  ts-test:
    build: ./ts
    image: sef-cpu-scheduling-ts:local
    # Tests need no network, so the container gets none.
    network_mode: "none"
  python-test:
    build: ./python
    image: sef-cpu-scheduling-python:local
    # Tests need no network, so the container gets none.
    network_mode: "none"
  # EN: The demo prints the Gantt charts and the comparison table, and writes results/.
  # PT: A demo imprime os gráficos de Gantt e a tabela de comparação, e grava results/.
  # ES: La demo imprime los diagramas de Gantt y la tabla de comparación, y escribe results/.
  demo:
    build: ./ts
    image: sef-cpu-scheduling-ts:local
    network_mode: "none"
    command: ["bun", "run", "src/cli.ts", "all", "--out", "/results"]
    volumes:
      - ./results:/results
  # EN: The same demo in Python. Its output must be identical to the TypeScript one.
  # PT: A mesma demo em Python. A saída precisa ser idêntica à do TypeScript.
  # ES: La misma demo en Python. Su salida debe ser idéntica a la de TypeScript.
  python-demo:
    build: ./python
    image: sef-cpu-scheduling-python:local
    network_mode: "none"
    command: ["python", "cli.py"]

# EN: One service per language. Each one builds a pinned image and runs its tests.
# PT: Um serviço por linguagem. Cada um constrói uma imagem fixada e roda seus testes.
# ES: Un servicio por lenguaje. Cada uno construye una imagen fijada y ejecuta sus pruebas.
name: memory-allocator

services:
  cpp-test:
    build: ./cpp
    image: sef-memory-allocator-cpp:local
    # Tests need no network, so the container gets none.
    network_mode: "none"
  rust-test:
    build: ./rust
    image: sef-memory-allocator-rust:local
    # Tests need no network, so the container gets none.
    network_mode: "none"
  # EN: The demo prints the fragmentation benchmark and writes results/results.md.
  # PT: A demo imprime o benchmark de fragmentação e grava results/results.md.
  # ES: La demo imprime el benchmark de fragmentación y escribe results/results.md.
  demo:
    build: ./cpp
    image: sef-memory-allocator-cpp:local
    network_mode: "none"
    command: ["sh", "-c", "./demo && ./demo --markdown > /results/results.md"]
    volumes:
      - ./results:/results
  # EN: The same benchmark from Rust. Its output must be identical to the C++ one.
  # PT: O mesmo benchmark em Rust. A saída precisa ser idêntica à do C++.
  # ES: El mismo benchmark en Rust. Su salida debe ser idéntica a la de C++.
  rust-demo:
    build: ./rust
    image: sef-memory-allocator-rust:local
    network_mode: "none"
    command: ["./target/release/memory-allocator"]

# EN: One service per language. Each one builds a pinned image and runs its tests.
# PT: Um serviço por linguagem. Cada um constrói uma imagem fixada e roda seus testes.
name: paging-tlb

services:
  rust-test:
    build: ./rust
    image: sef-paging-tlb-rust:local
    # Tests need no network, so the container gets none.
    network_mode: "none"
  ts-test:
    build: ./ts
    image: sef-paging-tlb-ts:local
    # Tests need no network, so the container gets none.
    network_mode: "none"
  # EN: The demo prints the page-fault tables and the TLB experiment, and writes results/.
  # PT: A demo imprime as tabelas de faltas de página e o experimento da TLB, e grava results/.
  demo:
    build: ./ts
    image: sef-paging-tlb-ts:local
    network_mode: "none"
    command: ["bun", "run", "src/cli.ts", "all", "--out", "/results"]
    volumes:
      - ./results:/results
  # EN: The page-fault tables again, from Rust. They must be identical to the TypeScript ones.
  # PT: As tabelas de faltas de página de novo, em Rust. Precisam ser idênticas às do TypeScript.
  rust-demo:
    build: ./rust
    image: sef-paging-tlb-rust:local
    network_mode: "none"
    command: ["./target/release/paging-tlb"]

# EN: Four services built from one image. `ts-test` has NO network: the type check, the
#     dependency-rule check and every unit test, including all the use cases, run with no
#     database and no HTTP server to reach. Only `ts-integration`, `api` and `demo` join the
#     network of the PostgreSQL container. That network is internal: nothing reaches the
#     internet, and no port is published on the host. The credentials are fake.
# PT: Quatro serviços feitos de uma imagem. `ts-test` NÃO tem rede: a checagem de tipos, a
#     verificação da regra de dependência e todos os testes de unidade, incluindo todos os casos
#     de uso, rodam sem banco e sem servidor HTTP para alcançar. Só `ts-integration`, `api` e
#     `demo` entram na rede do contêiner do PostgreSQL. Essa rede é interna: nada alcança a
#     internet, e nenhuma porta é publicada no host. As credenciais são falsas.
name: arch-clean-architecture-app

x-app: &app
  build: ./ts
  image: sef-clean-architecture-app-ts:local

x-postgres-env: &postgres-env
  NOTES_REPOSITORY: postgres
  DATABASE_URL: postgres://lab:lab-fake-password@db:5432/lab

services:
  ts-test:
    <<: *app
    network_mode: "none"

  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab-fake-password
      POSTGRES_DB: lab
    # EN: Over TCP on purpose: during initialisation the server answers on the Unix socket
    #     only and then restarts, and the application connects over TCP.
    # PT: Por TCP de propósito: durante a inicialização o servidor responde só no socket Unix
    #     e depois reinicia, e a aplicação conecta por TCP.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U lab -d lab"]
      interval: 1s
      timeout: 3s
      retries: 30
    networks:
      - lab

  ts-integration:
    <<: *app
    command: ["bun", "run", "test:integration"]
    environment: *postgres-env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lab

  # EN: The HTTP delivery mechanism, composed with the PostgreSQL repository.
  # PT: O mecanismo de entrega HTTP, composto com o repositório PostgreSQL.
  api:
    <<: *app
    command: ["bun", "run", "http"]
    environment: *postgres-env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:3000/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 1s
      timeout: 3s
      retries: 30
    networks:
      - lab

  demo:
    <<: *app
    command: ["bun", "run", "demo"]
    environment:
      <<: *postgres-env
      API_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - lab

networks:
  lab:
    internal: true

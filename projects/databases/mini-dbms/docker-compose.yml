# EN: One service per language. Each one builds a pinned image and runs its linter, formatter
#     check and tests. The build context is the project folder, because both languages read the
#     shared SQLite fixture in `fixtures/`.
# PT: Um serviço por linguagem. Cada um constrói uma imagem fixada e roda o linter, a checagem
#     do formatador e os testes. O contexto de build é a pasta do projeto, porque as duas
#     linguagens leem o fixture do SQLite compartilhado em `fixtures/`.
name: mini-dbms

services:
  rust-test:
    build:
      context: .
      dockerfile: rust/Dockerfile
    image: sef-mini-dbms-rust:local
    # Tests need no network, so the container gets none.
    network_mode: "none"
  python-test:
    build:
      context: .
      dockerfile: python/Dockerfile
    image: sef-mini-dbms-python:local
    # Tests need no network, so the container gets none.
    network_mode: "none"

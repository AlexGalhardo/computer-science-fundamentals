# EN: Two services on the same pinned image. `python-test` runs the linter, the formatter check
#     and the tests. `explain` runs the command line tool, which prints the reasoning for a
#     schema. Neither needs the network, so neither gets one.
# PT: Dois serviços na mesma imagem fixada. `python-test` roda o linter, a checagem do
#     formatador e os testes. `explain` roda a ferramenta de linha de comando, que imprime o
#     raciocínio para um esquema. Nenhum precisa de rede, então nenhum a recebe.
# ES: Dos servicios sobre la misma imagen fijada. `python-test` ejecuta el linter, la
#     verificación del formateador y las pruebas. `explain` ejecuta la herramienta de línea de
#     comandos, que imprime el razonamiento para un esquema. Ninguno necesita red, así que
#     ninguno la recibe.
name: normalisation-tool

services:
  python-test:
    build: ./python
    image: sef-normalisation-tool-python:local
    network_mode: "none"
  explain:
    build: ./python
    image: sef-normalisation-tool-python:local
    network_mode: "none"
    entrypoint: ["python", "cli.py"]
    command: []

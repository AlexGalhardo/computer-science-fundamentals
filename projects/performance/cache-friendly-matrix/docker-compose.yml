# EN: One image per language. Each one runs its tests, and the same image runs the demo:
#     `speedup` times the three variants and fails unless blocked is 2 times faster than naive,
#     `sweep` times the blocked variant with several block sizes. Nothing here needs a network.
# PT: Uma imagem por linguagem. Cada uma roda os seus testes, e a mesma imagem roda a demonstração:
#     `speedup` mede as três variantes e falha a menos que a em blocos seja 2 vezes mais rápida
#     que a ingênua, `sweep` mede a variante em blocos com vários tamanhos de bloco. Nada aqui
#     precisa de rede.
name: perf-cache-friendly-matrix

x-cpp: &cpp
  build: ./cpp
  image: sef-cache-friendly-matrix-cpp:local
  network_mode: "none"

x-rust: &rust
  build: ./rust
  image: sef-cache-friendly-matrix-rust:local
  network_mode: "none"

services:
  cpp-test:
    <<: *cpp
  rust-test:
    <<: *rust
  cpp-speedup:
    <<: *cpp
    command: ["./bench", "speedup", "${MATRIX_N:-1500}"]
  rust-speedup:
    <<: *rust
    command: ["./target/release/cache-friendly-matrix", "speedup", "${MATRIX_N:-1500}"]
  cpp-sweep:
    <<: *cpp
    command: ["./bench", "sweep", "${MATRIX_N:-1500}"]
  rust-sweep:
    <<: *rust
    command: ["./target/release/cache-friendly-matrix", "sweep", "${MATRIX_N:-1500}"]

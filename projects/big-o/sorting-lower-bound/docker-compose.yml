# EN: One test service and one demo service per language. Each language has its own pinned image.
# PT: Um serviço de teste e um de demo por linguagem. Cada linguagem tem sua imagem fixada.
# ES: Un servicio de prueba y uno de demo por lenguaje. Cada lenguaje tiene su imagen fijada.
name: sorting-lower-bound

services:
  ts-test:
    build: ./ts
    image: sef-sorting-lower-bound-ts:local
    # Tests need no network, so the container gets none.
    network_mode: "none"

  python-test:
    build: ./python
    image: sef-sorting-lower-bound-python:local
    # Tests need no network, so the container gets none.
    network_mode: "none"

  # EN: The demos write their tables to ./results on the host.
  # PT: As demos gravam suas tabelas em ./results no host.
  # ES: Las demos escriben sus tablas en ./results en el host.
  ts-demo:
    build: ./ts
    image: sef-sorting-lower-bound-ts:local
    network_mode: "none"
    command: ["bun", "run", "demo"]
    environment:
      RESULTS_DIR: /results
    volumes:
      - ./results:/results

  python-demo:
    build: ./python
    image: sef-sorting-lower-bound-python:local
    network_mode: "none"
    command: ["python", "demo.py"]
    environment:
      RESULTS_DIR: /results
    volumes:
      - ./results:/results

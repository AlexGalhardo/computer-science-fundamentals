# EN: One service runs the tests and another runs the demo. Both use the same pinned image.
# PT: Um serviço roda os testes e outro roda a demo. Os dois usam a mesma imagem fixada.
name: master-theorem

services:
  ts-test:
    build: ./ts
    image: sef-master-theorem-ts:local
    # Tests need no network, so the container gets none.
    network_mode: "none"

  # EN: The demo writes its tables to ./results on the host, which is what the page reads.
  #     To classify one recurrence: docker compose run --rm ts-demo bun run classify 7 2 2
  # PT: A demo grava suas tabelas em ./results no host, que é o que a página lê.
  #     Para classificar uma recorrência: docker compose run --rm ts-demo bun run classify 7 2 2
  ts-demo:
    build: ./ts
    image: sef-master-theorem-ts:local
    network_mode: "none"
    command: ["bun", "run", "demo"]
    environment:
      RESULTS_DIR: /results
    volumes:
      - ./results:/results

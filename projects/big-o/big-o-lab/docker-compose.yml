# EN: One service runs the tests and another runs the demo. Both use the same pinned image.
# PT: Um serviço roda os testes e outro roda a demo. Os dois usam a mesma imagem fixada.
name: big-o-lab

services:
  ts-test:
    build: ./ts
    image: sef-big-o-lab-ts:local
    # Tests need no network, so the container gets none.
    network_mode: "none"

  # EN: The demo writes its tables to ./results on the host, which is what the dashboard reads.
  # PT: A demo grava suas tabelas em ./results no host, que é o que o dashboard lê.
  ts-demo:
    build: ./ts
    image: sef-big-o-lab-ts:local
    network_mode: "none"
    command: ["bun", "run", "demo"]
    environment:
      RESULTS_DIR: /results
    volumes:
      - ./results:/results

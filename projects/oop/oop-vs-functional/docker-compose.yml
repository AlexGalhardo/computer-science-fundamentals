# EN: One test service and one demo service per language, plus the comparison. The build context
#     is this folder, so every image sees the shared scenarios.txt. Nothing here needs the
#     network at run time, so every container gets none.
# PT: Um serviço de teste e um de demonstração por linguagem, mais a comparação. O contexto de
#     build é esta pasta, então toda imagem enxerga o scenarios.txt compartilhado. Nada aqui
#     precisa de rede em tempo de execução, então nenhum contêiner a recebe.
name: oop-vs-functional

services:
  java-test:
    build:
      context: .
      dockerfile: java/Dockerfile
    image: sef-oop-vs-functional-java:local
    network_mode: "none"

  java-demo:
    build:
      context: .
      dockerfile: java/Dockerfile
    image: sef-oop-vs-functional-java:local
    network_mode: "none"
    command: ["java", "-cp", "/opt/classes", "Demo", "/app/scenarios.txt"]

  elixir-test:
    build:
      context: .
      dockerfile: elixir/Dockerfile
    image: sef-oop-vs-functional-elixir:local
    network_mode: "none"

  elixir-demo:
    build:
      context: .
      dockerfile: elixir/Dockerfile
    image: sef-oop-vs-functional-elixir:local
    network_mode: "none"
    command: ["mix", "cart.demo"]

  ts-test:
    build:
      context: .
      dockerfile: ts/Dockerfile
    image: sef-oop-vs-functional-ts:local
    network_mode: "none"

  ts-demo:
    build:
      context: .
      dockerfile: ts/Dockerfile
    image: sef-oop-vs-functional-ts:local
    network_mode: "none"
    command: ["bun", "run", "demo"]

  # EN: Prints the comparison table measured from the sources inside the image. To refresh the
  #     committed copy: docker compose run --rm compare > results/comparison.md
  # PT: Imprime a tabela de comparação medida a partir dos fontes de dentro da imagem. Para
  #     atualizar a cópia versionada: docker compose run --rm compare > results/comparison.md
  compare:
    build:
      context: .
      dockerfile: ts/Dockerfile
    image: sef-oop-vs-functional-ts:local
    network_mode: "none"
    command: ["bun", "run", "--silent", "compare"]

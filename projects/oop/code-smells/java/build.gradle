// EN: Gradle is used only to run Spotless (google-java-format). The code has no dependencies
//     and is compiled with plain javac in the Dockerfile.
// PT: O Gradle é usado só para rodar o Spotless (google-java-format). O código não tem
//     dependências e é compilado com javac puro no Dockerfile.
plugins {
	id "com.diffplug.spotless" version "8.10.3"
}

repositories {
	mavenCentral()
}

spotless {
	java {
		target "src/**/*.java", "negative/**/*.java"
		googleJavaFormat()
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

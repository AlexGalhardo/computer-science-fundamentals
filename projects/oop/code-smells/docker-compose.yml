# EN: One test service per language, plus the demo. Each one builds a pinned image. Nothing
#     needs the network at run time, so every container gets none.
# PT: Um serviço de teste por linguagem, mais a demo. Cada um constrói uma imagem fixada. Nada
#     precisa de rede em tempo de execução, então nenhum contêiner a recebe.
# ES: Un servicio de test por lenguaje, más la demo. Cada uno construye una imagen fijada. Nada
#     necesita red en tiempo de ejecución, así que ningún contenedor la recibe.
name: code-smells

services:
  ts-test:
    build: ./ts
    image: sef-code-smells-ts:local
    network_mode: "none"

  # EN: Prints the catalogue: for each smell, the size of both versions and one sample output.
  # PT: Imprime o catálogo: para cada mau cheiro, o tamanho das duas versões e uma saída de
  #     exemplo.
  # ES: Imprime el catálogo: para cada mal olor, el tamaño de ambas versiones y una salida de
  #     ejemplo.
  ts-demo:
    build: ./ts
    image: sef-code-smells-ts:local
    network_mode: "none"
    command: ["bun", "run", "demo"]

  java-test:
    build: ./java
    image: sef-code-smells-java:local
    network_mode: "none"

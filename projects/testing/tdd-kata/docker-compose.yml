# EN: `ts-test` runs the type check and the tests of the kata. `history` reads a git log from
#     standard input and checks the red/green/refactor rhythm of the commit prefixes. Git runs on
#     the host, where the repository is, and only the text of the log enters the container.
#     Neither service needs a network, so neither gets one.
# PT: `ts-test` roda a checagem de tipos e os testes do kata. `history` lê um git log da entrada
#     padrão e confere o ritmo red/green/refactor dos prefixos dos commits. O git roda no host,
#     onde está o repositório, e só o texto do log entra no contêiner.
#     Nenhum dos serviços precisa de rede, então nenhum recebe.
name: testing-tdd-kata

x-ts: &ts
  build: ./ts
  image: sef-tdd-kata-ts:local
  network_mode: "none"

services:
  ts-test:
    <<: *ts

  history:
    <<: *ts
    command: ["bun", "run", "history"]
    stdin_open: true

<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Tiny shop</title>
		<style>
			body {
				font-family: system-ui, sans-serif;
				max-width: 40rem;
				margin: 2rem auto;
				padding: 0 1rem;
			}
			li {
				margin: 0.5rem 0;
			}
			button {
				margin-left: 0.5rem;
			}
		</style>
	</head>
	<body>
		<h1>Tiny shop</h1>
		<p>10% off when the cart reaches 100.00.</p>

		<h2>Products</h2>
		<ul id="products" aria-label="Products"></ul>

		<h2>Cart</h2>
		<ul id="cart-lines" aria-label="Cart"></ul>
		<p>Subtotal: <span data-testid="cart-subtotal">0.00</span></p>
		<p>Discount: <span data-testid="cart-discount">0.00</span></p>
		<p>Total: <strong data-testid="cart-total">0.00</strong></p>

		<script src="/config.js"></script>
		<script type="module" src="/app.js"></script>
	</body>
</html>

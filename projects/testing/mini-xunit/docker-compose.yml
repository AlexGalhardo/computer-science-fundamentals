# EN: `python-test` and `ts-test` run the framework on its own tests (plus lint or type check).
#     `python-demo` and `ts-demo` run it on a folder with a test that fails on purpose: they
#     print the failure and EXIT WITH CODE 1, which is the behaviour being demonstrated.
#     Nothing needs a network, so no service gets one.
# PT: `python-test` e `ts-test` rodam o framework nos próprios testes (mais lint ou checagem de
#     tipos). `python-demo` e `ts-demo` o rodam em uma pasta com um teste que falha de propósito:
#     imprimem a falha e SAEM COM CÓDIGO 1, que é o comportamento demonstrado.
#     Nada precisa de rede, então nenhum serviço recebe.
# ES: `python-test` y `ts-test` ejecutan el framework sobre sus propias pruebas (más lint o
#     verificación de tipos). `python-demo` y `ts-demo` lo ejecutan en una carpeta con una prueba
#     que falla a propósito: imprimen el fallo y SALEN CON CÓDIGO 1, que es el comportamiento demostrado.
#     Nada necesita red, así que ningún servicio la recibe.
name: testing-mini-xunit

x-python: &python
  build: ./python
  image: sef-mini-xunit-python:local
  network_mode: "none"

x-ts: &ts
  build: ./ts
  image: sef-mini-xunit-ts:local
  network_mode: "none"

services:
  python-test:
    <<: *python

  python-demo:
    <<: *python
    command: ["python", "-m", "mini_xunit", "examples/failing"]

  ts-test:
    <<: *ts

  ts-demo:
    <<: *ts
    command: ["bun", "run", "src/cli.ts", "examples/failing"]

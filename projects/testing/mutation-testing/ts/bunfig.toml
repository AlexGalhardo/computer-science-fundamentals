# EN: Coverage settings of `bun test --coverage`. The report counts only the source files (test
#     files are skipped), and the run fails when line or function coverage is under 100%. That
#     makes "the weak suite has 100% line coverage" a fact checked by the tool, not a claim.
# PT: Configuração de cobertura do `bun test --coverage`. O relatório conta só os arquivos de
#     código (os de teste são ignorados), e a execução falha quando a cobertura de linhas ou de
#     funções fica abaixo de 100%. Isso faz de "a suíte fraca tem 100% de cobertura de linhas"
#     um fato conferido pela ferramenta, não uma alegação.
# ES: Configuración de cobertura de `bun test --coverage`. El informe cuenta solo los archivos de
#     código (los de prueba se ignoran), y la ejecución falla cuando la cobertura de líneas o de
#     funciones queda por debajo de 100%. Eso hace de "la suite débil tiene 100% de cobertura de
#     líneas" un hecho comprobado por la herramienta, no una afirmación.
[test]
coverageSkipTestFiles = true
coverageThreshold = { lines = 1.0, functions = 1.0 }

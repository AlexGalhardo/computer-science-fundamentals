# EN: The reference of the benchmark: NGINX doing the same job as the hand-written balancer,
#     round robin over the same three back ends. Nothing here is tuned beyond what the
#     comparison needs.
# PT: A referência do benchmark: o NGINX fazendo o mesmo trabalho do balanceador escrito à mão,
#     round robin sobre os mesmos três back ends. Nada aqui é ajustado além do que a comparação
#     precisa.
# ES: La referencia del benchmark: NGINX haciendo el mismo trabajo que el balanceador escrito a
#     mano, round robin sobre los mismos tres back ends. Nada aquí está ajustado más allá de lo
#     que la comparación necesita.

# One worker per core, like the Go runtime, which also uses every core.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
	worker_connections 4096;
}

http {
	# EN: No access log, because the hand-written balancer does not log requests either.
	# PT: Sem log de acesso, porque o balanceador escrito à mão também não registra requisições.
	# ES: Sin log de acceso, porque el balanceador escrito a mano tampoco registra solicitudes.
	access_log off;

	# EN: `resolve` asks Docker's DNS again when a back end is recreated with another address.
	#     It needs the shared memory `zone`, which also makes the workers share one rotation.
	# PT: O `resolve` pergunta de novo ao DNS do Docker quando um back end é recriado com outro
	#     endereço. Ele precisa da `zone` de memória compartilhada, que também faz os workers
	#     dividirem um único rodízio.
	# ES: `resolve` vuelve a preguntar al DNS de Docker cuando un back end se recrea con otra
	#     dirección. Necesita la `zone` de memoria compartida, que también hace que los workers
	#     compartan una única rotación.
	resolver 127.0.0.11 valid=2s ipv6=off;

	upstream backends {
		zone backends 64k;
		server api-1:3000 resolve;
		server api-2:3000 resolve;
		server api-3:3000 resolve;
	}

	server {
		listen 8080;

		location = /healthz {
			return 200 "ok\n";
		}

		location / {
			proxy_pass http://backends;
		}
	}
}

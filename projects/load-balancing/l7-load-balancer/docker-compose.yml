# EN: Everything in this file is local. The back ends, the balancers, NGINX and k6 talk to each
#     other on one docker network marked `internal`, which has no route to the outside world,
#     and no port is published to the host. The unit and integration tests of Go run with no
#     network at all: their servers live on the loopback interface of the test container.
# PT: Tudo neste arquivo é local. Os back ends, os balanceadores, o NGINX e o k6 conversam em
#     uma rede docker marcada como `internal`, que não tem rota para o mundo externo, e nenhuma
#     porta é publicada no host. Os testes unitários e de integração do Go rodam sem rede
#     nenhuma: os servidores deles vivem na interface de loopback do contêiner de teste.
name: l7-load-balancer

networks:
  lab:
    internal: true

volumes:
  # Raw k6 summaries. A docker volume, not a project folder: only the report reaches ./results.
  k6-raw: {}

x-go: &go
  build: ./go
  image: sef-l7-load-balancer-go:local

# EN: Three identical back ends. The health check asks the real port for /health.
# PT: Três back ends idênticos. A verificação de saúde pede /health na porta real.
x-api: &api
  <<: *go
  networks: [lab]
  command: ["backend"]
  healthcheck:
    test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/health"]
    interval: 2s
    timeout: 2s
    retries: 15

x-apis-healthy: &apis-healthy
  api-1: { condition: service_healthy }
  api-2: { condition: service_healthy }
  api-3: { condition: service_healthy }

# EN: The hand-written balancer, once per strategy, in front of the same three back ends.
# PT: O balanceador escrito à mão, uma vez por estratégia, na frente dos mesmos três back ends.
x-lb: &lb
  <<: *go
  networks: [lab]
  depends_on: *apis-healthy
  command: ["lb"]
  healthcheck:
    test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/lb/status"]
    interval: 2s
    timeout: 2s
    retries: 15

x-lb-env: &lb-env
  BACKENDS: http://api-1:3000,http://api-2:3000,http://api-3:3000
  HEALTH_INTERVAL: 1s
  HEALTH_TIMEOUT: 500ms

x-proxies-healthy: &proxies-healthy
  lb-rr: { condition: service_healthy }
  lb-lc: { condition: service_healthy }
  nginx: { condition: service_healthy }

services:
  api-1:
    <<: *api
    environment: { INSTANCE: api-1 }
  api-2:
    <<: *api
    environment: { INSTANCE: api-2 }
  api-3:
    <<: *api
    environment: { INSTANCE: api-3 }

  lb-rr:
    <<: *lb
    environment: { <<: *lb-env, STRATEGY: round-robin }
  lb-lc:
    <<: *lb
    environment: { <<: *lb-env, STRATEGY: least-connections }

  nginx:
    image: &nginx-image nginx:1.30.5-alpine
    networks: [lab]
    depends_on: *apis-healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Formatter, vet and every Go test (distribution, health checks, retry), with no network.
  go-test:
    <<: *go
    network_mode: "none"
    command: ["sh", "-c", "test -z \"$(gofmt -l .)\" && go vet ./... && go test -race -count=1 ./..."]

  # 30 requests through each proxy, 10 per back end.
  smoke-test:
    <<: *go
    networks: [lab]
    depends_on: *proxies-healthy
    volumes:
      - ./load:/load:ro
    command: ["sh", "/load/smoke-test.sh"]

  # EN: Proves the safety rule: with a target that is not local, k6 must exit with an error.
  #     The network is internal anyway, so even a broken rule could not reach the internet.
  # PT: Prova a regra de segurança: com um alvo que não é local, o k6 precisa terminar com erro.
  #     A rede é interna de qualquer forma, então nem uma regra quebrada alcançaria a internet.
  k6-refusal-test:
    image: &k6-image grafana/k6:2.3.0
    networks: [lab]
    volumes:
      - ./load:/load:ro
    entrypoint: ["sh", "/load/refusal-test.sh"]

  # EN: The benchmark. Root only inside this container, to write to the docker volume; nothing
  #     here touches the project folder.
  # PT: O benchmark. Root só dentro deste contêiner, para escrever no volume docker; nada aqui
  #     toca a pasta do projeto.
  k6-bench:
    image: *k6-image
    profiles: ["bench"]
    networks: [lab]
    depends_on: *proxies-healthy
    user: "0:0"
    environment:
      REPETITIONS: ${REPETITIONS:-5}
      VUS: ${VUS:-50}
      DURATION_S: ${DURATION_S:-10}
    volumes:
      - ./load:/load:ro
      - k6-raw:/raw
    entrypoint: ["sh", "/load/run-all.sh"]

  # EN: Reads the summaries and writes ./results, so it runs as the host user: on Linux the
  #     mounted folder belongs to that user and any other uid gets "permission denied".
  # PT: Lê os resumos e escreve em ./results, então roda como o usuário do host: no Linux a
  #     pasta montada pertence a esse usuário e qualquer outro uid recebe "permission denied".
  report:
    <<: *go
    profiles: ["bench"]
    network_mode: "none"
    depends_on:
      k6-bench: { condition: service_completed_successfully }
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      NGINX_IMAGE: *nginx-image
      K6_IMAGE: *k6-image
    volumes:
      - k6-raw:/raw:ro
      - ./results:/out
    command: ["report"]

# EN: NGINX as a layer 7 load balancer in front of three identical instances. One route per
#     balancing method, so the lab can compare them with the same back ends.
# PT: NGINX como balanceador de carga de camada 7 na frente de três instâncias idênticas. Uma
#     rota por método de balanceamento, para o laboratório compará-los com os mesmos back ends.

# EN: Two worker processes on purpose. Each worker keeps its own counters unless the upstream
#     has a `zone` (shared memory), and least connections only works across workers with one.
# PT: Dois processos worker de propósito. Cada worker guarda seus próprios contadores a não ser
#     que o upstream tenha uma `zone` (memória compartilhada), e o least connections só
#     funciona entre workers com ela.
worker_processes 2;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
	worker_connections 4096;
}

http {
	access_log off;

	# EN: ip_hash uses the address of the client. Inside the lab every request comes from one
	#     container, so the load generator sends the simulated client address in
	#     X-Forwarded-For and NGINX is told to believe that header ONLY from private networks.
	#     On the internet, list here only the addresses of your own proxies.
	# PT: O ip_hash usa o endereço do cliente. Dentro do laboratório toda requisição vem de um
	#     contêiner, então o gerador de carga manda o endereço simulado do cliente em
	#     X-Forwarded-For e o NGINX é instruído a acreditar nesse cabeçalho SÓ vindo de redes
	#     privadas. Na internet, liste aqui apenas os endereços dos seus próprios proxies.
	set_real_ip_from 10.0.0.0/8;
	set_real_ip_from 172.16.0.0/12;
	set_real_ip_from 192.168.0.0/16;
	real_ip_header X-Forwarded-For;

	# EN: By default NGINX turns the name of an upstream server into an address once, when it
	#     starts. If the container of an instance is recreated and gets another address, NGINX
	#     keeps sending its traffic to the old one, which may now belong to another instance.
	#     The `resolve` parameter of each server (it needs a `zone`) asks the resolver below
	#     again: 127.0.0.11 is the DNS server that Docker gives to every container.
	# PT: Por padrão o NGINX transforma o nome de um servidor do upstream em endereço uma vez,
	#     ao iniciar. Se o contêiner de uma instância for recriado e receber outro endereço, o
	#     NGINX continua mandando o tráfego dela para o antigo, que agora pode ser de outra
	#     instância. O parâmetro `resolve` de cada servidor (ele precisa de uma `zone`) pergunta
	#     de novo ao resolvedor abaixo: 127.0.0.11 é o servidor DNS que o Docker dá a todo
	#     contêiner.
	resolver 127.0.0.11 valid=2s ipv6=off;

	# EN: No method directive means weighted round robin with every weight equal to 1.
	# PT: Sem diretiva de método, vale o round robin ponderado com todos os pesos iguais a 1.
	upstream rr {
		zone rr 64k;
		server api-1:3000 resolve;
		server api-2:3000 resolve;
		server api-3:3000 resolve;
	}

	# EN: Weights 3, 2, 1: out of every 6 requests, 3 go to api-1, 2 to api-2 and 1 to api-3.
	# PT: Pesos 3, 2, 1: de cada 6 requisições, 3 vão para api-1, 2 para api-2 e 1 para api-3.
	upstream wrr {
		zone wrr 64k;
		server api-1:3000 weight=3 resolve;
		server api-2:3000 weight=2 resolve;
		server api-3:3000 weight=1 resolve;
	}

	# EN: Least connections: the next request goes to the server with the fewest in progress.
	# PT: Least connections: a próxima requisição vai para o servidor com menos em andamento.
	upstream lc {
		zone lc 64k;
		least_conn;
		server api-1:3000 resolve;
		server api-2:3000 resolve;
		server api-3:3000 resolve;
	}

	# EN: ip_hash: the same client address always reaches the same server. For IPv4 the key is
	#     the first three octets, so a whole /24 network counts as one client.
	# PT: ip_hash: o mesmo endereço de cliente sempre chega ao mesmo servidor. Em IPv4 a chave
	#     são os três primeiros octetos, então uma rede /24 inteira conta como um cliente.
	upstream iphash {
		zone iphash 64k;
		ip_hash;
		server api-1:3000 resolve;
		server api-2:3000 resolve;
		server api-3:3000 resolve;
	}

	# EN: Passive health check: after max_fails failed attempts within fail_timeout the server
	#     is skipped for fail_timeout. The defaults are max_fails=1 and fail_timeout=10s.
	#     Open source NGINX has no periodic probe, so a real request is what finds a failure.
	# PT: Verificação de saúde passiva: depois de max_fails tentativas com falha dentro de
	#     fail_timeout o servidor é pulado por fail_timeout. Os padrões são max_fails=1 e
	#     fail_timeout=10s. O NGINX de código aberto não tem sonda periódica, então é uma
	#     requisição real que descobre a falha.
	upstream tuned {
		zone tuned 64k;
		server api-1:3000 max_fails=1 fail_timeout=3s resolve;
		server api-2:3000 max_fails=1 fail_timeout=3s resolve;
		server api-3:3000 max_fails=1 fail_timeout=3s resolve;
	}

	server {
		listen 8080;

		location = /healthz {
			return 200 "ok\n";
		}

		# EN: Only these exact paths are proxied, and all of them become /work on the back end.
		#     The control routes of the instances are not reachable through the proxy.
		# PT: Só estes caminhos exatos passam pelo proxy, e todos viram /work no back end. As
		#     rotas de controle das instâncias não são alcançáveis pelo proxy.
		location = /rr {
			proxy_pass http://rr/work;
		}

		location = /wrr {
			proxy_pass http://wrr/work;
		}

		location = /lc {
			proxy_pass http://lc/work;
		}

		location = /iphash {
			proxy_pass http://iphash/work;
		}

		# EN: The defaults already retry on another server after a connection error or a
		#     timeout (proxy_next_upstream error timeout), but the default timeouts are 60 s.
		#     Short timeouts are what make a frozen back end cost one second instead of sixty.
		# PT: Os padrões já tentam outro servidor depois de um erro de conexão ou timeout
		#     (proxy_next_upstream error timeout), mas os timeouts padrão são de 60 s. Timeouts
		#     curtos é que fazem um back end congelado custar um segundo em vez de sessenta.
		location = /tuned {
			proxy_pass http://tuned/work;
			proxy_connect_timeout 1s;
			proxy_read_timeout 1s;
			proxy_next_upstream error timeout http_502 http_503;
			proxy_next_upstream_tries 3;
		}

		location / {
			return 404;
		}
	}
}

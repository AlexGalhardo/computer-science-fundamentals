# EN: An API (ElysiaJS), its PostgreSQL (the source of truth), its Redis (the cache), and k6 as
#     the readers. The network is internal: no container reaches the internet, and no port is
#     published on the host, so k6 can only ever hit the `api` service of this lab. The
#     credentials are fake.
# PT: Uma API (ElysiaJS), o seu PostgreSQL (a fonte da verdade), o seu Redis (o cache), e o k6
#     como os leitores. A rede é interna: nenhum contêiner alcança a internet, e nenhuma porta é
#     publicada no host, então o k6 só consegue atingir o serviço `api` deste laboratório. As
#     credenciais são falsas.
# ES: Una API (ElysiaJS), su PostgreSQL (la fuente de la verdad), su Redis (el caché), y k6
#     como los lectores. La red es interna: ningún contenedor alcanza internet, y no se publica
#     ningún puerto en el host, así que k6 solo puede llegar al servicio `api` de este
#     laboratorio. Las credenciales son falsas.
name: cache-cache-strategies

x-app: &app
  build: ./ts
  image: sef-cache-strategies-ts:local
  environment: &app-env
    DATABASE_URL: postgres://lab:lab-fake-password@db:5432/lab
    REDIS_URL: redis://redis:6379
    POOL_SIZE: "20"
    FLUSH_INTERVAL_MS: "200"
    PROJECT_DIR: /project
    K6_DIR: /k6
  networks:
    - lab

x-stores: &stores
  db:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab-fake-password
      POSTGRES_DB: lab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U lab -d lab"]
      interval: 1s
      timeout: 3s
      retries: 90
    networks:
      - lab

  # EN: A pure cache: persistence is off (no RDB snapshot, no AOF), so a restart comes back
  #     empty. That is exactly the failure the write-behind test simulates.
  # PT: Um cache puro: a persistência está desligada (sem snapshot RDB, sem AOF), então um
  #     reinício volta vazio. É exatamente a falha que o teste do write-behind simula.
  # ES: Un caché puro: la persistencia está desactivada (sin snapshot RDB, sin AOF), así que un
  #     reinicio vuelve vacío. Es exactamente la falla que simula la prueba del write-behind.
  redis:
    image: redis:8.10.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "-p", "6379", "ping"]
      interval: 1s
      timeout: 3s
      retries: 90
    networks:
      - lab

  api:
    <<: *app
    command: ["bun", "run", "start"]
    depends_on: *stores
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3000/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 1s
      timeout: 3s
      retries: 90

  ts-test:
    <<: *app
    depends_on: *stores
    volumes:
      - ./k6:/k6:ro

  # EN: One run is one experiment and one round: `docker compose run --rm -e MODE=lock k6-stampede`
  #     or `docker compose run --rm -e STRATEGY=write-behind -e TTL_MS=1000 k6-hit-rate`.
  #     The raw summaries go to k6-results/, which is git-ignored.
  # PT: Uma execução é um experimento e uma rodada: `docker compose run --rm -e MODE=lock k6-stampede`
  #     ou `docker compose run --rm -e STRATEGY=write-behind -e TTL_MS=1000 k6-hit-rate`.
  #     Os resumos brutos vão para k6-results/, que o git ignora.
  # ES: Una ejecución es un experimento y una ronda: `docker compose run --rm -e MODE=lock k6-stampede`
  #     o `docker compose run --rm -e STRATEGY=write-behind -e TTL_MS=1000 k6-hit-rate`.
  #     Los resúmenes en bruto van a k6-results/, que git ignora.
  k6-stampede: &k6
    image: grafana/k6:2.3.0
    command: ["run", "--quiet", "--no-usage-report", "/scripts/stampede.js"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      BASE_URL: http://api:3000
      MODE: none
      ROUND: "1"
    volumes:
      - ./k6:/scripts:ro
      - ./k6-results:/results
    networks:
      - lab

  k6-hit-rate:
    <<: *k6
    command: ["run", "--quiet", "--no-usage-report", "/scripts/hit-rate.js"]
    environment:
      BASE_URL: http://api:3000
      STRATEGY: cache-aside
      TTL_MS: "1000"
      ROUND: "1"

  report:
    <<: *app
    command: ["bun", "run", "report"]
    depends_on: *stores
    environment:
      <<: *app-env
      K6_IMAGE: grafana/k6:2.3.0
      POSTGRES_IMAGE: postgres:18.6-alpine
      REDIS_IMAGE: redis:8.10.2-alpine
    # EN: Run as the host user. On Linux the mounted project folder belongs to that user, and the
    #     image's own user (uid 1000) could not write results into it. The scripts export
    #     HOST_UID and HOST_GID; on Docker Desktop the default works.
    # PT: Roda como o usuário do host. No Linux a pasta montada pertence a ele, e o usuário da
    #     imagem (uid 1000) não conseguiria gravar os resultados. Os scripts exportam HOST_UID e
    #     HOST_GID; no Docker Desktop o padrão funciona.
    # ES: Se ejecuta como el usuario del host. En Linux la carpeta montada le pertenece, y el
    #     usuario de la propia imagen (uid 1000) no podría escribir los resultados en ella. Los
    #     scripts exportan HOST_UID y HOST_GID; en Docker Desktop el valor por defecto funciona.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - .:/project

networks:
  lab:
    internal: true

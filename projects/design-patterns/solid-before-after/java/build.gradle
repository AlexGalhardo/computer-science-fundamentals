// EN: The only plugin is Spotless, the formatter required for Java in this repository. There
//     is no library dependency: the tests use a small harness in src/test (see Check.java).
// PT: O único plugin é o Spotless, o formatador exigido para Java neste repositório. Não há
//     dependência de biblioteca: os testes usam um arcabouço pequeno em src/test (veja
//     Check.java).
// ES: El único plugin es Spotless, el formateador exigido para Java en este repositorio. No hay
//     dependencia de biblioteca: las pruebas usan un arnés pequeño en src/test (ver
//     Check.java).
plugins {
	id "java"
	id "com.diffplug.spotless" version "8.10.3"
}

repositories {
	mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
	options.release = 25
	// Every warning is an error, so the build log stays clean.
	options.compilerArgs += ["-Xlint:all", "-Werror"]
}

// EN: Same settings as docker/java/spotless.gradle at the repository root. They are copied here
//     because the Docker build context is this folder, and a mini-project stands alone.
// PT: Mesma configuração de docker/java/spotless.gradle na raiz do repositório. Ela é copiada
//     aqui porque o contexto de build do Docker é esta pasta, e um mini-projeto se sustenta
//     sozinho.
// ES: Misma configuración que docker/java/spotless.gradle en la raíz del repositorio. Se copia
//     aquí porque el contexto de construcción de Docker es esta carpeta, y un miniproyecto se
//     sostiene solo.
spotless {
	java {
		target "src/**/*.java"
		googleJavaFormat()
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

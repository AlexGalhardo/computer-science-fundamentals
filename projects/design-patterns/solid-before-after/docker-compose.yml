# EN: One test service per language, plus the demo. Each one builds a pinned image.
# PT: Um serviço de teste por linguagem, mais a demo. Cada um constrói uma imagem fixada.
# ES: Un servicio de pruebas por lenguaje, más la demo. Cada uno construye una imagen fijada.
name: solid-before-after

services:
  ts-test:
    build: ./ts
    image: sef-solid-before-after-ts:local
    # Tests need no network, so the container gets none.
    network_mode: "none"

  # EN: Building this image is what checks the Java formatting (Spotless) and compiles with every
  #     warning as an error. Running it executes the tests.
  # PT: Construir esta imagem é o que confere a formatação do Java (Spotless) e compila com todo
  #     aviso tratado como erro. Rodá-la executa os testes.
  # ES: Construir esta imagen es lo que comprueba el formato de Java (Spotless) y compila con todo
  #     aviso tratado como error. Ejecutarla corre las pruebas.
  java-test:
    build: ./java
    image: sef-solid-before-after-java:local
    network_mode: "none"

  # EN: The demo runs the same call on both versions of each principle and compares the answers.
  # PT: A demo executa a mesma chamada nas duas versões de cada princípio e compara as respostas.
  # ES: La demo ejecuta la misma llamada en las dos versiones de cada principio y compara las respuestas.
  ts-demo:
    build: ./ts
    image: sef-solid-before-after-ts:local
    network_mode: "none"
    command: ["bun", "run", "demo"]

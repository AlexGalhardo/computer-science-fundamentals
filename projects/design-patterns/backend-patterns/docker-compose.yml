# EN: One service runs the tests and another runs the demo. Both use the same pinned image.
# PT: Um serviço roda os testes e outro roda a demo. Os dois usam a mesma imagem fixada.
name: backend-patterns

services:
  ts-test:
    build: ./ts
    image: sef-backend-patterns-ts:local
    # Tests need no network, so the container gets none.
    network_mode: "none"

  # EN: The demo prints, for each pattern, what the failing design and the pattern version do.
  # PT: A demo mostra, para cada padrão, o que o desenho com defeito e a versão com o padrão fazem.
  ts-demo:
    build: ./ts
    image: sef-backend-patterns-ts:local
    network_mode: "none"
    command: ["bun", "run", "demo"]

# EN: One service per language. Each one builds a pinned image and runs its formatter check,
#     linter and tests. The build context is the project folder, because both languages read
#     the shared files in `fixtures/` and `results/`.
# PT: Um serviço por linguagem. Cada um constrói uma imagem fixada e roda a checagem do
#     formatador, o linter e os testes. O contexto de build é a pasta do projeto, porque as duas
#     linguagens leem os arquivos compartilhados em `fixtures/` e `results/`.
name: huffman-lz77

services:
  rust-test:
    build:
      context: .
      dockerfile: rust/Dockerfile
    image: sef-huffman-lz77-rust:local
    # Tests need no network, so the container gets none.
    network_mode: "none"
  python-test:
    build:
      context: .
      dockerfile: python/Dockerfile
    image: sef-huffman-lz77-python:local
    # Tests need no network, so the container gets none.
    network_mode: "none"

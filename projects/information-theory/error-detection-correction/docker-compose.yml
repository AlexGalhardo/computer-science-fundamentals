# EN: One image, two services: the tests and the noise simulator.
# PT: Uma imagem, dois serviços: os testes e o simulador de ruído.
name: error-detection-correction

services:
  cpp-test:
    build: ./cpp
    image: sef-error-detection-correction-cpp:local
    # Tests need no network, so the container gets none.
    network_mode: "none"
  # EN: The demo prints the table of detected, corrected and missed errors and writes
  #     results/results.md.
  # PT: A demo imprime a tabela de erros detectados, corrigidos e perdidos e grava
  #     results/results.md.
  demo:
    build: ./cpp
    image: sef-error-detection-correction-cpp:local
    network_mode: "none"
    command: ["sh", "-c", "./demo && ./demo --markdown > /results/results.md"]
    volumes:
      - ./results:/results

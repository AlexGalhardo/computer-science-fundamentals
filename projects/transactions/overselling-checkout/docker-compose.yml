# EN: A shop API (ElysiaJS), its PostgreSQL, and k6 as the crowd of buyers. The network is
#     internal: no container reaches the internet, and no port is published on the host, so k6
#     can only ever hit the `api` service of this lab. The credentials are fake.
# PT: Uma API de loja (ElysiaJS), o seu PostgreSQL, e o k6 como a multidão de compradores. A rede
#     é interna: nenhum contêiner alcança a internet, e nenhuma porta é publicada no host, então
#     o k6 só consegue atingir o serviço `api` deste laboratório. As credenciais são falsas.
# ES: Una API de tienda (ElysiaJS), su PostgreSQL, y k6 como la multitud de compradores. La red
#     es interna: ningún contenedor llega a internet, y no se publica ningún puerto en el host, así que
#     k6 solo puede alcanzar el servicio `api` de este laboratorio. Las credenciales son falsas.
name: tx-overselling-checkout

x-app: &app
  build: ./ts
  image: sef-overselling-checkout-ts:local
  environment: &app-env
    DATABASE_URL: postgres://lab:lab-fake-password@db:5432/lab
    THINK_TIME_MS: "2"
    POOL_SIZE: "20"
    PROJECT_DIR: /project
  networks:
    - lab

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab-fake-password
      POSTGRES_DB: lab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U lab -d lab"]
      interval: 1s
      timeout: 3s
      retries: 30
    networks:
      - lab

  api:
    <<: *app
    command: ["bun", "run", "start"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:3000/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 1s
      timeout: 3s
      retries: 30

  ts-test:
    <<: *app
    depends_on:
      db:
        condition: service_healthy

  # EN: One run is one strategy and one round: `docker compose run --rm -e STRATEGY=naive k6`.
  #     The raw summaries go to k6-results/, which is git-ignored.
  # PT: Uma execução é uma estratégia e uma rodada: `docker compose run --rm -e STRATEGY=naive k6`.
  #     Os resumos brutos vão para k6-results/, que o git ignora.
  # ES: Una ejecución es una estrategia y una ronda: `docker compose run --rm -e STRATEGY=naive k6`.
  #     Los resúmenes crudos van a k6-results/, que git ignora.
  k6:
    image: grafana/k6:2.3.0
    command: ["run", "--quiet", "--no-usage-report", "/scripts/checkout.js"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      BASE_URL: http://api:3000
      STRATEGY: naive
      ROUND: "1"
    volumes:
      - ./k6:/scripts:ro
      - ./k6-results:/results
    networks:
      - lab

  report:
    <<: *app
    command: ["bun", "run", "report"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
      K6_IMAGE: grafana/k6:2.3.0
    # EN: Run as the host user. On Linux the mounted project folder belongs to that user, and the
    #     image's own user (uid 1000) could not write results into it. The setup script exports
    #     HOST_UID and HOST_GID; on Docker Desktop the default works.
    # PT: Roda como o usuário do host. No Linux a pasta montada pertence a ele, e o usuário da
    #     imagem (uid 1000) não conseguiria gravar os resultados. O script de setup exporta
    #     HOST_UID e HOST_GID; no Docker Desktop o padrão funciona.
    # ES: Se ejecuta como el usuario del host. En Linux la carpeta montada le pertenece, y el
    #     usuario de la imagen (uid 1000) no podría escribir los resultados en ella. El script de
    #     setup exporta HOST_UID y HOST_GID; en Docker Desktop el valor por defecto funciona.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - .:/project

networks:
  lab:
    internal: true

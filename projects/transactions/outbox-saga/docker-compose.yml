# EN: Two services, each with its own PostgreSQL, and a RabbitMQ broker between them. The
#     network is internal: no container reaches the internet and no port is published on the
#     host. All credentials are fake and exist only inside this lab.
# PT: Dois serviços, cada um com o seu PostgreSQL, e um broker RabbitMQ entre eles. A rede é
#     interna: nenhum contêiner alcança a internet e nenhuma porta é publicada no host. Todas as
#     credenciais são falsas e existem só dentro deste laboratório.
name: tx-outbox-saga

x-postgres: &postgres
  image: postgres:18.6-alpine
  environment:
    POSTGRES_USER: lab
    POSTGRES_PASSWORD: lab-fake-password
    POSTGRES_DB: lab
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U lab -d lab"]
    interval: 1s
    timeout: 3s
    retries: 30
  networks:
    - lab

x-app: &app
  build: ./ts
  image: sef-outbox-saga-ts:local
  networks:
    - lab

x-service-health: &service-health
  test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:3000/health'); process.exit(r.ok ? 0 : 1)"]
  interval: 1s
  timeout: 3s
  retries: 60

x-client-env: &client-env
  ORDER_SERVICE_URL: http://order-service:3000
  PAYMENT_SERVICE_URL: http://payment-service:3000
  BROKER_URL: amqp://lab:lab-fake-password@broker:5672
  PROJECT_DIR: /project

x-client-depends: &client-depends
  order-service:
    condition: service_healthy
  payment-service:
    condition: service_healthy

services:
  orders-db:
    <<: *postgres

  payments-db:
    <<: *postgres

  broker:
    image: rabbitmq:4.3.6-alpine
    environment:
      RABBITMQ_DEFAULT_USER: lab
      RABBITMQ_DEFAULT_PASS: lab-fake-password
    healthcheck:
      # EN: A plain TCP check. `rabbitmq-diagnostics` would run as root and, when it wins the race
      #     with a slow start, create the Erlang cookie file as root: the broker, which runs as
      #     the `rabbitmq` user, then cannot read it and exits.
      # PT: Uma checagem TCP simples. O `rabbitmq-diagnostics` rodaria como root e, quando ganha
      #     a corrida contra uma inicialização lenta, cria o arquivo de cookie do Erlang como
      #     root: o broker, que roda como o usuário `rabbitmq`, não consegue lê-lo e encerra.
      test: ["CMD", "nc", "-z", "127.0.0.1", "5672"]
      interval: 3s
      timeout: 10s
      retries: 40
    networks:
      - lab

  # EN: `restart: on-failure` is part of the lesson: the crash scenario kills this process, and
  #     Docker brings it back, like a process supervisor would in production.
  # PT: `restart: on-failure` faz parte da lição: o cenário de queda mata este processo, e o
  #     Docker o traz de volta, como um supervisor de processos faria em produção.
  order-service:
    <<: *app
    command: ["bun", "run", "order-service"]
    restart: on-failure
    depends_on:
      orders-db:
        condition: service_healthy
      broker:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://lab:lab-fake-password@orders-db:5432/lab
      BROKER_URL: amqp://lab:lab-fake-password@broker:5672
    healthcheck: *service-health

  payment-service:
    <<: *app
    command: ["bun", "run", "payment-service"]
    restart: on-failure
    depends_on:
      payments-db:
        condition: service_healthy
      broker:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://lab:lab-fake-password@payments-db:5432/lab
      BROKER_URL: amqp://lab:lab-fake-password@broker:5672
    healthcheck: *service-health

  ts-test:
    <<: *app
    depends_on: *client-depends
    environment: *client-env

  demo:
    <<: *app
    command: ["bun", "run", "demo"]
    depends_on: *client-depends
    environment: *client-env
    # EN: Run as the host user. On Linux the mounted project folder belongs to that user, and the
    #     image's own user (uid 1000) could not write results into it. The setup script exports
    #     HOST_UID and HOST_GID; on Docker Desktop the default works.
    # PT: Roda como o usuário do host. No Linux a pasta montada pertence a ele, e o usuário da
    #     imagem (uid 1000) não conseguiria gravar os resultados. O script de setup exporta
    #     HOST_UID e HOST_GID; no Docker Desktop o padrão funciona.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - .:/project

networks:
  lab:
    internal: true

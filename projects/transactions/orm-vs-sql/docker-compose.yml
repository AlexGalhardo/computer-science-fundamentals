# EN: A local PostgreSQL and one TypeScript image that runs the tests or the benchmark. The
#     network is internal: no container reaches the internet and no port is published on the
#     host. The credentials are fake and exist only inside this lab.
# PT: Um PostgreSQL local e uma imagem TypeScript que roda os testes ou o benchmark. A rede é
#     interna: nenhum contêiner alcança a internet e nenhuma porta é publicada no host. As
#     credenciais são falsas e existem só dentro deste laboratório.
# ES: Un PostgreSQL local y una imagen TypeScript que ejecuta las pruebas o el benchmark. La red es
#     interna: ningún contenedor llega a internet y no se publica ningún puerto en el host. Las
#     credenciales son falsas y existen solo dentro de este laboratorio.
name: tx-orm-vs-sql

x-lab: &lab
  build: ./ts
  image: sef-orm-vs-sql-ts:local
  depends_on:
    db:
      condition: service_healthy
  environment:
    DATABASE_URL: postgres://lab:lab-fake-password@db:5432/lab
    PROJECT_DIR: /project
  # EN: The project folder is mounted so the tests can write the captured SQL next to each
  #     query, and the benchmark can write results/ and the README tables.
  # PT: A pasta do projeto é montada para os testes gravarem o SQL capturado ao lado de cada
  #     consulta, e o benchmark gravar results/ e as tabelas do README.
  # ES: La carpeta del proyecto se monta para que las pruebas escriban el SQL capturado junto a cada
  #     consulta, y para que el benchmark escriba results/ y las tablas del README.
  # EN: Run as the host user. On Linux the mounted project folder belongs to that user, and the
  #     image's own user (uid 1000) could not write results into it. The setup script exports
  #     HOST_UID and HOST_GID; on Docker Desktop the default works.
  # PT: Roda como o usuário do host. No Linux a pasta montada pertence a ele, e o usuário da
  #     imagem (uid 1000) não conseguiria gravar os resultados. O script de setup exporta
  #     HOST_UID e HOST_GID; no Docker Desktop o padrão funciona.
  # ES: Se ejecuta como el usuario del host. En Linux la carpeta montada le pertenece, y el usuario
  #     de la imagen (uid 1000) no podría escribir los resultados en ella. El script de setup
  #     exporta HOST_UID y HOST_GID; en Docker Desktop el valor por defecto funciona.
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  volumes:
    - .:/project
  networks:
    - lab

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab-fake-password
      POSTGRES_DB: lab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U lab -d lab"]
      interval: 1s
      timeout: 3s
      retries: 30
    networks:
      - lab

  ts-test:
    <<: *lab

  bench:
    <<: *lab
    command: ["bun", "run", "bench"]

networks:
  lab:
    internal: true

# EN: A local PostgreSQL and one TypeScript image that runs the tests or the benchmark. The
#     network is internal: no container reaches the internet and no port is published on the
#     host. The credentials are fake and exist only inside this lab.
# PT: Um PostgreSQL local e uma imagem TypeScript que roda os testes ou o benchmark. A rede é
#     interna: nenhum contêiner alcança a internet e nenhuma porta é publicada no host. As
#     credenciais são falsas e existem só dentro deste laboratório.
name: tx-orm-vs-sql

x-lab: &lab
  build: ./ts
  image: sef-orm-vs-sql-ts:local
  depends_on:
    db:
      condition: service_healthy
  environment:
    DATABASE_URL: postgres://lab:lab-fake-password@db:5432/lab
    PROJECT_DIR: /project
  # EN: The project folder is mounted so the tests can write the captured SQL next to each
  #     query, and the benchmark can write results/ and the README tables.
  # PT: A pasta do projeto é montada para os testes gravarem o SQL capturado ao lado de cada
  #     consulta, e o benchmark gravar results/ e as tabelas do README.
  volumes:
    - .:/project
  networks:
    - lab

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab-fake-password
      POSTGRES_DB: lab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 1s
      timeout: 3s
      retries: 30
    networks:
      - lab

  ts-test:
    <<: *lab

  bench:
    <<: *lab
    command: ["bun", "run", "bench"]

networks:
  lab:
    internal: true

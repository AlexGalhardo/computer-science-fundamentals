# EN: A local PostgreSQL and the TypeScript harness that drives two sessions against it. The
#     network is internal: no container reaches the internet and no port is published on the
#     host. The credentials are fake and exist only inside this lab.
# PT: Um PostgreSQL local e o harness em TypeScript que conduz duas sessões contra ele. A rede é
#     interna: nenhum contêiner alcança a internet e nenhuma porta é publicada no host. As
#     credenciais são falsas e existem só dentro deste laboratório.
name: tx-isolation-levels

x-lab: &lab
  build: ./ts
  image: sef-isolation-levels-ts:local
  depends_on:
    db:
      condition: service_healthy
  environment:
    DATABASE_URL: postgres://lab:lab-fake-password@db:5432/lab
    PROJECT_DIR: /project
  networks:
    - lab

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab-fake-password
      POSTGRES_DB: lab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 1s
      timeout: 3s
      retries: 30
    networks:
      - lab

  # EN: The project folder is mounted so the tests can write results/ and the README matrix.
  # PT: A pasta do projeto é montada para os testes gravarem results/ e a matriz do README.
  ts-test:
    <<: *lab
    volumes:
      - .:/project

  demo:
    <<: *lab
    command: ["bun", "run", "demo"]

networks:
  lab:
    internal: true

# EN: Copy of the repository's `.golangci.yml`, needed here because the Docker build context is
#     this folder. misspell is left out on purpose: comments here are bilingual, and it reports
#     Portuguese words as misspelled English.
# PT: Cópia do `.golangci.yml` do repositório, necessária aqui porque o contexto de build do
#     Docker é esta pasta. O misspell fica de fora de propósito: os comentários aqui são
#     bilíngues, e ele reporta palavras em português como erros de inglês.
# ES: Copia del `.golangci.yml` del repositorio, necesaria aquí porque el contexto de build de
#     Docker es esta carpeta. misspell se deja fuera a propósito: los comentarios aquí son
#     bilingües, y reporta palabras en portugués como errores de inglés.
version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - revive
formatters:
  enable:
    - gofmt
    - goimports

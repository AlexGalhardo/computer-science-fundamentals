# EN: One service per language. Each one builds a pinned image and runs its tests.
# PT: Um serviço por linguagem. Cada um constrói uma imagem fixada e roda seus testes.
# ES: Un servicio por lenguaje. Cada uno construye una imagen fijada y ejecuta sus pruebas.
name: sorting-race

services:
  ts-test:
    build: ./ts
    image: sef-sorting-race-ts:local
    # Tests need no network, so the container gets none.
    network_mode: "none"
  cpp-test:
    build: ./cpp
    image: sef-sorting-race-cpp:local
    # Tests need no network, so the container gets none.
    network_mode: "none"
  python-test:
    build: ./python
    image: sef-sorting-race-python:local
    # Tests need no network, so the container gets none.
    network_mode: "none"
  java-test:
    build: ./java
    image: sef-sorting-race-java:local
    # Tests need no network, so the container gets none.
    network_mode: "none"
  elixir-test:
    build: ./elixir
    image: sef-sorting-race-elixir:local
    # Tests need no network, so the container gets none.
    network_mode: "none"
  rust-test:
    build: ./rust
    image: sef-sorting-race-rust:local
    # Tests need no network, so the container gets none.
    network_mode: "none"
  go-test:
    build: ./go
    image: sef-sorting-race-go:local
    # Tests need no network, so the container gets none.
    network_mode: "none"

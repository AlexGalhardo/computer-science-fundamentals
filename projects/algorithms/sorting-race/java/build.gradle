// EN: Gradle is used only for formatting: `gradle spotlessCheck` and `gradle spotlessApply` run
//     google-java-format through Spotless. Compiling and testing use plain javac (see Dockerfile).
// PT: O Gradle é usado só para formatação: `gradle spotlessCheck` e `gradle spotlessApply` rodam
//     o google-java-format pelo Spotless. Compilar e testar usam javac puro (veja o Dockerfile).
// ES: Gradle se usa solo para el formato: `gradle spotlessCheck` y `gradle spotlessApply` ejecutan
//     google-java-format mediante Spotless. Compilar y probar usan javac puro (mira el Dockerfile).
plugins {
	id "com.diffplug.spotless" version "8.10.3"
}

repositories {
	mavenCentral()
}

spotless {
	java {
		target "*.java"
		googleJavaFormat()
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

# EN: Same linters as the .golangci.yml at the repository root. The only difference: misspell
#     reads Portuguese words of the bilingual comments as English typos, so those are listed.
# PT: Mesmos linters do .golangci.yml da raiz do repositório. A única diferença: o misspell lê
#     palavras em português dos comentários bilíngues como erros de inglês, então elas são listadas.
version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - revive
  settings:
    misspell:
      ignore-rules:
        - algoritmos
        - algoritmo
        - programas
formatters:
  enable:
    - gofmt
    - goimports

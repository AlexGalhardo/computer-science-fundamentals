# EN: Same linters as the .golangci.yml at the repository root. The only difference: misspell
#     reads Portuguese and Spanish words of the comments as English typos, so those are listed.
# PT: Mesmos linters do .golangci.yml da raiz do repositório. A única diferença: o misspell lê
#     palavras em português e espanhol dos comentários como erros de inglês, então elas são listadas.
# ES: Los mismos linters del .golangci.yml de la raíz del repositorio. La única diferencia: misspell
#     lee palabras en portugués y español de los comentarios como errores de inglés, así que se listan.
version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - revive
  settings:
    misspell:
      ignore-rules:
        - algoritmos
        - algoritmo
        - programas
        - decisiones
formatters:
  enable:
    - gofmt
    - goimports

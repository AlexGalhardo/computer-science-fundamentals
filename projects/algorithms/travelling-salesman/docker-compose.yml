# EN: One service per language. Each one builds a pinned image and runs its tests.
# PT: Um serviço por linguagem. Cada um constrói uma imagem fixada e roda seus testes.
name: travelling-salesman

services:
  ts-test:
    build: ./ts
    image: sef-travelling-salesman-ts:local
    # Tests need no network, so the container gets none.
    network_mode: "none"
  rust-test:
    build: ./rust
    image: sef-travelling-salesman-rust:local
    # Tests need no network, so the container gets none.
    network_mode: "none"
  # EN: The demo compares the heuristics with the optimum on 64 random instances.
  # PT: A demo compara as heurísticas com o ótimo em 64 instâncias aleatórias.
  demo:
    build: ./ts
    image: sef-travelling-salesman-ts:local
    command: ["bun", "run", "src/demo.ts"]
    network_mode: "none"

# EN: One service per language. Each one builds a pinned image and runs its tests.
# PT: Um serviço por linguagem. Cada um constrói uma imagem fixada e roda seus testes.
name: hybrid-quicksort

services:
  cpp-test:
    build: ./cpp
    image: sef-hybrid-quicksort-cpp:local
    # Tests need no network, so the container gets none.
    network_mode: "none"
  rust-test:
    build: ./rust
    image: sef-hybrid-quicksort-rust:local
    # Tests need no network, so the container gets none.
    network_mode: "none"
  # EN: The sweep sorts 1,000,000 random values with each threshold and prints the best one.
  # PT: A varredura ordena 1.000.000 de valores aleatórios com cada limiar e imprime o melhor.
  cpp-sweep:
    build: ./cpp
    image: sef-hybrid-quicksort-cpp:local
    command: ["./bench", "sweep", "1000000"]
    network_mode: "none"
  rust-sweep:
    build: ./rust
    image: sef-hybrid-quicksort-rust:local
    command: ["cargo", "run", "--release", "--offline", "--quiet", "--", "sweep", "1000000"]
    network_mode: "none"

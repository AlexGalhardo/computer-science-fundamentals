# EN: One service per language. Each one builds a pinned image and runs its tests.
# PT: Um serviço por linguagem. Cada um constrói uma imagem fixada e roda seus testes.
# ES: Un servicio por lenguaje. Cada uno construye una imagen fijada y ejecuta sus pruebas.
name: dynamic-programming

services:
  ts-test:
    build: ./ts
    image: sef-dynamic-programming-ts:local
    # Tests need no network, so the container gets none.
    network_mode: "none"
  python-test:
    build: ./python
    image: sef-dynamic-programming-python:local
    # Tests need no network, so the container gets none.
    network_mode: "none"
  # EN: The demo prints the tables step by step and the call counts.
  # PT: A demo imprime as tabelas passo a passo e as contagens de chamadas.
  # ES: La demo imprime las tablas paso a paso y los conteos de llamadas.
  demo:
    build: ./ts
    image: sef-dynamic-programming-ts:local
    command: ["bun", "run", "src/demo.ts"]
    network_mode: "none"
  python-demo:
    build: ./python
    image: sef-dynamic-programming-python:local
    command: ["python", "demo.py"]
    network_mode: "none"

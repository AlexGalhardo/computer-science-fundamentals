# Go: gofmt decides the format (tabs). golangci-lint v2 runs the linters below.
# misspell is left out on purpose: comments here are bilingual, and it reports Portuguese
# words such as "algoritmos" or "processos" as misspelled English.
version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - revive
formatters:
  enable:
    - gofmt
    - goimports

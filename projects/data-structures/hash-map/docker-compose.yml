# EN: One service per language. Each one builds a pinned image and runs its tests.
# PT: Um serviço por linguagem. Cada um constrói uma imagem fixada e roda seus testes.
name: hash-map

services:
  cpp-test:
    build: ./cpp
    image: sef-hash-map-cpp:local
    # Tests need no network, so the container gets none.
    network_mode: "none"
  rust-test:
    build: ./rust
    image: sef-hash-map-rust:local
    # Tests need no network, so the container gets none.
    network_mode: "none"
  ts-test:
    build: ./ts
    image: sef-hash-map-ts:local
    # Tests need no network, so the container gets none.
    network_mode: "none"

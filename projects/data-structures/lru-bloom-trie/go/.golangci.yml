# Go: same linters as the .golangci.yml at the repository root.
# The comments are bilingual, and misspell reads some Portuguese words as English typos
# ("problemas" for "problems"), so those words are listed below.
version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - revive
  settings:
    misspell:
      ignore-rules:
        - problemas
        - candidatas
        - componentes
        - algoritmos
formatters:
  enable:
    - gofmt
    - goimports

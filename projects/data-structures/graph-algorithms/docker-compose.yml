# EN: One service per language. Each one builds a pinned image and runs its tests. The ten
#     reference cases are not copied into the project: they are mounted read-only from
#     `references/`, where the original course material lives.
# PT: Um serviço por linguagem. Cada um constrói uma imagem fixada e roda seus testes. Os dez
#     casos de referência não são copiados para o projeto: são montados como somente leitura a
#     partir de `references/`, onde fica o material original da disciplina.
name: graph-algorithms

services:
  cpp-test:
    build: ./cpp
    image: sef-graph-algorithms-cpp:local
    # Tests need no network, so the container gets none.
    network_mode: "none"
    environment:
      GRAPH_CASES_DIR: /cases
    volumes:
      - ../../../references/usp/data-structures-2/trabalhos/grafos/casos-de-teste:/cases:ro
      - ./cases:/samples:ro
  go-test:
    build: ./go
    image: sef-graph-algorithms-go:local
    # Tests need no network, so the container gets none.
    network_mode: "none"
    environment:
      GRAPH_CASES_DIR: /cases
    volumes:
      - ../../../references/usp/data-structures-2/trabalhos/grafos/casos-de-teste:/cases:ro
      - ./cases:/samples:ro

# EN: One service per language. Each one builds a pinned image and runs its tests. The ten
#     reference cases live in `reference-cases/` and are mounted read-only into each container.
# PT: Um serviço por linguagem. Cada um constrói uma imagem fixada e roda seus testes. Os dez
#     casos de referência ficam em `reference-cases/` e são montados como somente leitura em cada contêiner.
name: graph-algorithms

services:
  cpp-test:
    build: ./cpp
    image: sef-graph-algorithms-cpp:local
    # Tests need no network, so the container gets none.
    network_mode: "none"
    environment:
      GRAPH_CASES_DIR: /cases
    volumes:
      - ./reference-cases:/cases:ro
      - ./cases:/samples:ro
  go-test:
    build: ./go
    image: sef-graph-algorithms-go:local
    # Tests need no network, so the container gets none.
    network_mode: "none"
    environment:
      GRAPH_CASES_DIR: /cases
    volumes:
      - ./reference-cases:/cases:ro
      - ./cases:/samples:ro

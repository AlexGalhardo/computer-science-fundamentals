# Go: same linters as the .golangci.yml at the repository root.
# EN: The comments are in English, Portuguese and Spanish, and misspell reads some Portuguese
#     and Spanish words as English typos ("problemas" for "problems", "recorre" for
#     "recorder"), so those words are listed below.
# PT: Os comentários estão em inglês, português e espanhol, e o misspell lê algumas palavras em
#     português e espanhol como erros de inglês ("problemas" como "problems", "recorre" como
#     "recorder"), então essas palavras estão listadas abaixo.
# ES: Los comentarios están en inglés, portugués y español, y misspell lee algunas palabras en
#     portugués y español como errores de inglés ("problemas" como "problems", "recorre" como
#     "recorder"), así que esas palabras se listan abajo.
version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - revive
  settings:
    misspell:
      ignore-rules:
        - problemas
        - candidatas
        - componentes
        - algoritmos
        - calcularon
        - recorre
        - representaciones
formatters:
  enable:
    - gofmt
    - goimports

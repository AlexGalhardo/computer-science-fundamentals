[package]
name = "b-tree-on-disk"
version = "0.1.0"
edition = "2024"

[dependencies]

[[bin]]
name = "demo"
path = "src/demo.rs"

# EN: The tests insert a million keys through the pager. Optimising the test build keeps the
#     run short, and overflow checks stay on because they are part of what the tests verify.
# PT: Os testes inserem um milhão de chaves pelo pager. Otimizar o build de teste mantém a
#     execução curta, e as checagens de overflow continuam ligadas porque fazem parte do que os
#     testes verificam.
# ES: Las pruebas insertan un millón de claves por el pager. Optimizar el build de prueba mantiene
#     la ejecución corta, y las verificaciones de overflow siguen activadas porque son parte de lo
#     que las pruebas verifican.
[profile.dev]
opt-level = 2

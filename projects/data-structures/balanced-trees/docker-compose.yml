# EN: One service per language. Each one builds a pinned image and runs its tests.
# PT: Um serviço por linguagem. Cada um constrói uma imagem fixada e roda seus testes.
# ES: Un servicio por lenguaje. Cada uno construye una imagen fijada y corre sus pruebas.
name: balanced-trees

services:
  cpp-test:
    build: ./cpp
    image: sef-balanced-trees-cpp:local
    # Tests need no network, so the container gets none.
    network_mode: "none"
  java-test:
    build: ./java
    image: sef-balanced-trees-java:local
    # Tests need no network, so the container gets none.
    network_mode: "none"

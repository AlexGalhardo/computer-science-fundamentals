# EN: One test service and one demo service per language. Each builds a pinned image.
#     Nothing here needs a network: the mini TCP talks over the loopback interface, which
#     exists inside the container even with networking disabled.
# PT: Um serviço de teste e um de demonstração por linguagem. Cada um constrói uma imagem fixada.
#     Nada aqui precisa de rede: o mini TCP conversa pela interface de loopback, que existe
#     dentro do contêiner mesmo com a rede desativada.
# ES: Un servicio de prueba y uno de demostración por lenguaje. Cada uno construye una imagen
#     fijada. Nada aquí necesita red: el mini TCP conversa por la interfaz de loopback, que existe
#     dentro del contenedor incluso con la red desactivada.
name: sliding-window-mini-tcp

services:
  go-test:
    build: ./go
    image: sef-sliding-window-mini-tcp-go:local
    network_mode: "none"
  go-demo:
    build: ./go
    image: sef-sliding-window-mini-tcp-go:local
    network_mode: "none"
    command: ["go", "run", "./cmd/demo"]
  elixir-test:
    build: ./elixir
    image: sef-sliding-window-mini-tcp-elixir:local
    network_mode: "none"
  elixir-demo:
    build: ./elixir
    image: sef-sliding-window-mini-tcp-elixir:local
    network_mode: "none"
    command: ["mix", "run", "demo.exs"]

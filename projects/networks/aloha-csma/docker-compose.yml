# EN: Tests, simulation and chart share one pinned image. Nothing needs a network, so no
#     container gets one. The only thing shared with the host is the results folder.
# PT: Testes, simulação e gráfico usam a mesma imagem fixada. Nada precisa de rede, então
#     nenhum contêiner recebe uma. A única coisa compartilhada com o host é a pasta de resultados.
name: aloha-csma

services:
  python-test:
    build: ./python
    image: sef-aloha-csma-python:local
    network_mode: "none"
  python-demo:
    build: ./python
    image: sef-aloha-csma-python:local
    network_mode: "none"
    volumes:
      - ./results:/results
    command: ["python", "run.py", "--out", "/results"]
  python-chart:
    build: ./python
    image: sef-aloha-csma-python:local
    network_mode: "none"
    volumes:
      - ./results:/results
    command: ["python", "chart.py", "/results/results.json", "/results/throughput.svg"]

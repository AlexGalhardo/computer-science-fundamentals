<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<title>Language benchmarks</title>
		<!-- EN: Everything this page needs sits next to it: built CSS, data and scripts. There is
		         no CDN and no request to the network, so it works when opened from disk.
		     PT: Tudo que esta página precisa está ao lado dela: CSS compilado, dados e scripts.
		         Não há CDN nem requisição de rede, então ela funciona aberta direto do disco. -->
		<link rel="stylesheet" href="tailwind.css" />
	</head>
	<body class="bg-page font-sans text-ink antialiased">
		<a
			href="#app"
			class="sr-only rounded bg-card px-3 py-2 focus:not-sr-only focus:fixed focus:left-2 focus:top-2 focus:z-50"
			>Skip to content</a
		>
		<header class="top-0 z-30 border-b border-line bg-card md:sticky">
			<div class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-2 px-4 py-2">
				<p class="text-base font-bold" id="brand">Language benchmarks</p>
				<div class="flex items-center gap-2">
					<fieldset class="flex overflow-hidden rounded-lg border border-line" id="language-switch">
						<button type="button" data-lang="en" class="min-h-11 min-w-11 px-3 text-sm font-semibold" lang="en">EN</button>
						<button type="button" data-lang="pt" class="min-h-11 min-w-11 border-l border-line px-3 text-sm font-semibold" lang="pt-BR">PT</button>
					</fieldset>
					<button type="button" id="theme-toggle" class="min-h-11 rounded-lg border border-line px-3 text-sm font-semibold"></button>
				</div>
			</div>
			<nav id="nav" class="mx-auto max-w-5xl px-4 pb-2"></nav>
		</header>

		<main id="app" class="mx-auto max-w-5xl px-4 pb-16 pt-6">
			<noscript>
				<p class="rounded-lg border border-line bg-card p-4">
					This page draws its charts with JavaScript. The same numbers are in the README tables.<br />
					Esta página desenha os gráficos com JavaScript. Os mesmos números estão nas tabelas do README.
				</p>
			</noscript>
		</main>

		<!-- EN: The one floating box that shows every explanation. role="tooltip" tells screen
		         readers what it is. The glossary keeps the same texts always on the page.
		     PT: A única caixa flutuante que mostra todas as explicações. O role="tooltip" diz aos
		         leitores de tela o que ela é. O glossário mantém os mesmos textos sempre na página. -->
		<div
			id="tip"
			role="tooltip"
			hidden
			class="pointer-events-none fixed z-40 whitespace-pre-line rounded-lg bg-tip px-3 py-2 text-sm leading-snug text-tip-ink shadow-lg"
		></div>

		<!-- EN: Data and texts are loaded as scripts, not fetched: a page opened from disk
		         (file://) is not allowed to fetch a JSON file.
		     PT: Os dados e os textos são carregados como scripts, não buscados: uma página aberta do
		         disco (file://) não tem permissão para buscar um arquivo JSON. -->
		<script src="results/results.js"></script>
		<script src="content.js"></script>
		<script src="dashboard.js"></script>
	</body>
</html>

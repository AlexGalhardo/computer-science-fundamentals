// Java: Spotless with google-java-format. A project applies this file from its build.gradle:
//   plugins { id "com.diffplug.spotless" version "8.10.3" }
//   apply from: "<path to>/spotless.gradle"
spotless {
	java {
		target "src/**/*.java"
		googleJavaFormat()
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

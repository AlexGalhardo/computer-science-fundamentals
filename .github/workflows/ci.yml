# EN: Continuous integration. Every push and pull request must pass the same checks that run
#     locally: format and lint, type check, unit tests, quiz content validation, the quiz
#     end-to-end tests, and the tests of every mini-project.
# PT: Integração contínua. Todo push e pull request precisa passar nas mesmas verificações que
#     rodam localmente: formatação e lint, checagem de tipos, testes unitários, validação do
#     conteúdo do quiz, testes de ponta a ponta do quiz, e os testes de todo mini-projeto.
# ES: Integración continua. Cada push y pull request debe pasar las mismas verificaciones que
#     corren en local: formato y lint, chequeo de tipos, pruebas unitarias, validación del
#     contenido del quiz, pruebas de punta a punta del quiz, y las pruebas de todo mini-proyecto.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual run, for example to rerun everything after a flaky failure.
  workflow_dispatch:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

concurrency:
  # The event is part of the group, so a push does not cancel a manual full run.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # JS/TS: Biome (format and lint), markdownlint, TypeScript, unit tests and quiz content.
  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Format and lint (Biome)
        run: bunx biome ci .
      # EN: Every Markdown file of the repository, with the rules of .markdownlint-cli2.jsonc.
      #     The tool is the version pinned in package.json, installed by the step above.
      # PT: Todo arquivo Markdown do repositório, com as regras do .markdownlint-cli2.jsonc.
      #     A ferramenta é a versão fixada no package.json, instalada pelo passo acima.
      # ES: Todo archivo Markdown del repositorio, con las reglas de .markdownlint-cli2.jsonc.
      #     La herramienta es la versión fijada en package.json, instalada por el paso de arriba.
      - name: Markdown lint (markdownlint)
        run: bun run lint:md
      - name: Type check
        run: bun run typecheck
      - name: Unit tests
        run: bun test quiz/tests/unit tools
      - name: Quiz content validation
        run: bun run quiz:validate
      - name: Documentation index is up to date
        run: bun run docs:index --check

  # Formatters of the other ecosystems, each inside its pinned image from docker/.
  formatters:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: python
            check: ruff check . && ruff format --check .
          - lang: go
            check: test -z "$(gofmt -l projects benchmarks 2>/dev/null)"
          - lang: rust
            check: find projects benchmarks -name '*.rs' -not -path '*/target/*' 2>/dev/null | xargs -r rustfmt --check --edition 2024
          - lang: cpp
            check: find projects benchmarks \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) 2>/dev/null | xargs -r clang-format --dry-run --Werror
          - lang: elixir
            check: find projects benchmarks -name mix.exs -not -path '*/deps/*' 2>/dev/null | xargs -r -n1 dirname | xargs -r -I{} sh -c 'cd {} && mix format --check-formatted mix.exs "{lib,test,config}/**/*.{ex,exs}"'
    steps:
      - uses: actions/checkout@v5
      - name: Build the pinned ${{ matrix.lang }} image
        run: docker build -q -f docker/${{ matrix.lang }}.Dockerfile -t sef-${{ matrix.lang }}:local docker
      - name: Format check
        # The command travels in an environment variable: pasted into the script, its own
        # quotes would end the quoted argument early and part of it would run on the runner.
        env:
          CHECK: ${{ matrix.check }}
        run: docker run --rm -v "$PWD:/app" -w /app sef-${{ matrix.lang }}:local sh -c "$CHECK"

  # The quiz: static build from the test fixture, unit tests and Playwright, all in Docker.
  quiz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Unit and end-to-end tests
        run: ./quiz/setup-unix-quiz.sh test
      # Every committed dashboard must work opened from disk, with no network at all.
      - name: Static dashboards open from disk
        run: |
          pages=$(ls -d projects/*/*/dashboard/index.html benchmarks/dashboard/index.html 2>/dev/null | sed 's#^#/work/#')
          [ -z "$pages" ] && exit 0
          docker run --rm --network none             -v "$PWD:/work:ro"             -v "$PWD/tools/scaffold/tests/open-from-disk.mjs:/repo/quiz/open-from-disk.mjs:ro"             -w /repo/quiz sef-quiz-e2e:local node open-from-disk.mjs $pages

  # EN: Every mini-project is tested on every run, not only the ones whose folder changed: a
  # change in a shared file (a pinned image in docker/, the workflow, the quiz content a project
  # links to) can break a project whose own folder did not change. Each one runs its own setup
  # script.
  # PT: Todo mini-projeto é testado em toda execução, não só os que tiveram a pasta alterada:
  # uma mudança em um arquivo compartilhado (uma imagem fixada em docker/, o workflow, o
  # conteúdo do quiz para o qual o projeto aponta) pode quebrar um projeto cuja pasta não mudou.
  # ES: Cada mini-proyecto se prueba en cada ejecución, no solo los que cambiaron de carpeta:
  # un cambio en un archivo compartido (una imagen fijada en docker/, el workflow, el contenido
  # del quiz al que apunta el proyecto) puede romper un proyecto cuya carpeta no cambió.
  list-projects:
    runs-on: ubuntu-24.04
    outputs:
      projects: ${{ steps.list.outputs.projects }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: |
          projects=$(for dir in projects/*/*/; do
              dir=${dir%/}
              if [ -f "$dir/setup-unix-$(basename "$dir").sh" ]; then echo "$dir"; fi
            done | jq -R . | jq -sc .)
          echo "Found $(echo "$projects" | jq length) mini-projects"
          echo "projects=${projects:-[]}" >> "$GITHUB_OUTPUT"

  mini-projects:
    needs: list-projects
    if: needs.list-projects.outputs.projects != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.list-projects.outputs.projects) }}
    steps:
      - uses: actions/checkout@v5
      - name: Run the setup script of ${{ matrix.project }}
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          script="$PROJECT/setup-unix-$(basename "$PROJECT").sh"
          chmod +x "$script"
          "$script"
